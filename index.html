<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Westeros LCG — Simulador AGoT 2.0</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=3">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Westeros LCG">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0d0e12;--panel:#17191f;--panel2:#1f222a;--line:#2e323c;--gold:#d9a642;--gold2:#f0c96a;--txt:#e6e1d6;--dim:#8d8a83;--red:#c0392b;--green:#3f9d5a;--blue:#3c6fb0;
--f-stark:#c9ccd1;--f-lannister:#a8231d;--f-baratheon:#d8b21f;--f-greyjoy:#1f4f6b;--f-martell:#d97a1e;--f-thenightswatch:#3a3a3a;--f-targaryen:#6e1414;--f-tyrell:#2f6b2a;--f-neutral:#8a7a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#1b1d26 0%,var(--bg) 60%);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:6px 12px;border-radius:6px}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(#c8952f,#9c6f1c);color:#1a1205;border-color:#e0b552;font-weight:600}
button.pri:hover:not(:disabled){color:#000;filter:brightness(1.1)}
button.warn{border-color:#7a2a24}
input,select,textarea{font:inherit;background:#0f1116;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
header{display:flex;align-items:center;gap:18px;padding:8px 16px;background:#08090c;border-bottom:1px solid #2a2418}
header h1{font-family:'Cinzel',serif;font-size:20px;margin:0;letter-spacing:2px;color:var(--gold2);font-weight:600}
header nav{display:flex;gap:4px}
header nav button{background:none;border:none;color:var(--gold);font-family:'Cinzel',serif;font-size:15px;padding:6px 10px}
header nav button.on{color:#fff;border-bottom:2px solid var(--gold)}
.screen{display:none;height:calc(100vh - 47px);height:calc(100dvh - 47px)}
.screen.on{display:flex}
/* ---------- cartas ---------- */
.card{position:relative;width:90px;height:132px;border-radius:7px;background:#e9dfc6;color:#1d1a14;border:2px solid #222;box-shadow:0 2px 6px #0009;overflow:hidden;user-select:none;flex:none;transition:transform .15s}
.card .hd{height:27px;background:var(--fc);color:#fff;font-size:9px;line-height:1.1;font-weight:700;padding:2px 3px 0 22px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 1px #000}
.card.fac-stark .hd{color:#111;text-shadow:none}
.card .cost{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#ffd877,#b8861e);color:#2a1c00;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid #5a3d00}
.card .body{padding:3px 4px;font-size:9px;line-height:1.15}
.card .ty{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:#6b5f48}
.card .tr{font-style:italic;font-size:8.5px;color:#4a4232;margin-top:1px}
.card .icons{position:absolute;left:3px;top:52px;display:flex;flex-direction:column;gap:2px}
.ic{display:inline-flex;width:15px;height:15px;border-radius:3px;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
.ic.M{background:#b3261e}.ic.I{background:#2b8a3e}.ic.P{background:#c99a17}
.card .str{position:absolute;left:2px;bottom:2px;width:22px;height:22px;border-radius:4px;background:#3b3b3b;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid #000}
.card .str.up{background:#2f7d43}.card .str.down{background:#8a2a20}
.card .kw{position:absolute;left:26px;right:3px;bottom:3px;font-size:8px;font-weight:700;color:#3a2f1d;line-height:1.1}
.card .mid{position:absolute;left:4px;right:3px;top:50px;font-size:8.5px;color:#3b3427;line-height:1.15}
.card .warn{position:absolute;right:2px;top:29px;font-size:10px}
.card .badges{position:absolute;right:2px;bottom:2px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tok{border-radius:10px;padding:0 5px;font-size:10px;font-weight:800;color:#fff;border:1px solid #000;line-height:15px}
.tok.pow{background:#7b3fb0}.tok.dup{background:#555}.tok.gold{background:#b8861e}
.card.back{background:repeating-linear-gradient(45deg,#3a2414,#3a2414 6px,#2c1a0e 6px,#2c1a0e 12px);border-color:#6d4a22}
.card.plotc{width:126px;height:88px}
.card.plotc .pst{position:absolute;bottom:3px;left:4px;right:4px;display:flex;justify-content:space-between;font-size:9px;font-weight:700}
.slot{position:relative;width:94px;height:138px;display:flex;align-items:flex-start;justify-content:center;flex:none}
.slot.kneel{width:138px}
.slot.kneel>.card{transform:rotate(90deg) translate(22px,0)}
.slot .atts{position:absolute;left:0;right:0;bottom:-6px;display:flex;flex-direction:column;gap:1px;z-index:2}
.slot.kneel .atts{left:18px;right:18px}
.attc{background:#cfc2a0;color:#1d1a14;border:1px solid #333;border-radius:3px;font-size:9px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.attc.kn{opacity:.6;font-style:italic}
.cand{outline:3px solid #46d06a;outline-offset:1px;cursor:pointer;box-shadow:0 0 12px #46d06a}
.sel{outline:3px solid #f0c96a!important;box-shadow:0 0 14px #f0c96a!important}
.act{outline:2px dashed #46d06a;outline-offset:1px;cursor:pointer}
.card.atk::after,.card.def::after{position:absolute;top:44px;right:2px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;color:#fff}
.card.atk::after{content:'ATQ';background:#b3261e}.card.def::after{content:'DEF';background:#2f5d9c}
.card.blank{filter:grayscale(.7)}
/* ---------- tabuleiro ---------- */
#game{gap:0}
#gside{width:230px;display:flex;flex-direction:column;gap:8px;padding:8px;border-right:1px solid var(--line);background:#0b0c10cc;overflow:auto}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.pp.me{border-color:#5a4a26}
.pp .nm{font-family:'Cinzel',serif;font-size:15px;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.stat{background:#0f1116;border:1px solid var(--line);border-radius:14px;padding:2px 8px;font-weight:700}
.stat.p{color:#c99cf0}.stat.g{color:#f0c96a}
.piles{display:flex;gap:4px;flex-wrap:wrap}
.piles button{padding:2px 6px;font-size:11px}
.fbadge{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;background:var(--fc);text-shadow:0 1px 2px #000}
.fbadge.kn{opacity:.5;text-decoration:line-through}
.phasebox{background:#2b1d4a;border:1px solid #5a3f93;border-radius:8px;padding:8px;text-align:center}
.phasebox b{display:block;font-family:'Cinzel',serif;font-size:15px;letter-spacing:1px}
.mini-plot{margin-top:6px}
#gcenter{flex:1;display:flex;flex-direction:column;min-width:0}
#board{flex:1;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:6px;min-height:142px;align-items:flex-start;flex-wrap:wrap;padding:2px;border-radius:8px}
.row.locs{min-height:142px;background:#ffffff05}
.row .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.divider{display:flex;align-items:center;gap:10px;min-height:34px;margin:2px 0}
.divider .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#5a4a26,transparent)}
.chb{background:#2a1414;border:1px solid #7a2a24;border-radius:20px;padding:5px 14px;font-weight:700}
.chb .a{color:#ff8b7e}.chb .d{color:#8fb4ff}
#prompt{background:#141720;border-top:1px solid #3b3220;border-bottom:1px solid #3b3220;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
#prompt .txt{flex:1;min-width:200px;font-weight:600;color:var(--gold2)}
#prompt .txt.wait{color:var(--dim);font-weight:400}
#hand{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;min-height:150px;background:#0a0b0e}
#oppHand{display:flex;gap:3px;padding:2px 0}
#oppHand .card{width:28px;height:40px;border-width:1px}
#gright{width:290px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#0b0c10cc}
#preview{height:330px;padding:10px;border-bottom:1px solid var(--line);overflow:auto}
.pvbox .pv-name{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2)}
.pvbox .pv-meta{color:var(--dim);margin:4px 0}
.pvbox .pv-row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pvbox .pv-txt{background:#0f1116;border:1px solid var(--line);border-radius:6px;padding:8px;line-height:1.45;margin-top:6px}
.pvbox .pv-warn{color:#f0a35a}
#log{flex:1;overflow:auto;padding:8px 10px;font-size:12px;line-height:1.45}
#log div{border-bottom:1px solid #ffffff08;padding:1px 0}
#log .phase{color:var(--gold2);font-family:'Cinzel',serif;margin-top:6px}
#log .ch{color:#ffb4a8}#log .chw{color:#ffd36a;font-weight:600}#log .kill{color:#ff7a6a}#log .pow{color:#c99cf0}#log .gold{color:#e8c46a}#log .dim{color:var(--dim)}#log .win{color:#7dff9a;font-weight:700;font-size:14px}#log .ev{color:#9fd3ff}
.menu{position:fixed;z-index:50;background:#1b1e26;border:1px solid var(--gold);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 20px #000}
.menu button{text-align:left}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:40}
.modal .box{background:var(--panel);border:1px solid #5a4a26;border-radius:10px;max-width:min(980px,94vw);max-height:88vh;overflow:auto;padding:14px 16px}
.modal h3{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold2)}
.cgrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.overlay-win{font-family:'Cinzel',serif;font-size:26px;color:var(--gold2);text-align:center;margin:6px 0 12px}
/* ---------- ecrãs de menu ---------- */
.wrap{flex:1;overflow:auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold2);font-size:18px}
.lobby{max-width:760px;margin:0 auto}
.lobby label{display:block;color:var(--dim);margin:10px 0 4px}
.lobby select{width:100%}
.note{color:var(--dim);font-size:12px;line-height:1.5}
/* ---------- deckbuilder ---------- */
#decks{gap:0}
#dlist{width:220px;border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#dlist .di{padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
#dlist .di:hover{background:var(--panel2)}
#dlist .di.on{border-color:var(--gold);background:#2a2316}
#dlist .di small{display:block;color:var(--dim)}
#pool{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button.on{border-color:var(--gold);color:var(--gold2);background:#2a2316}
.tbl{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#1d2029;text-align:left;font-weight:600;color:var(--dim);padding:6px;font-size:12px;z-index:1}
td{padding:4px 6px;border-top:1px solid #ffffff0a}
tr:hover td{background:#ffffff06}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.qty button{border:none;border-radius:0;padding:2px 8px;background:#0f1116}
.qty button.on{background:var(--blue);color:#fff}
#dside{width:330px;border-left:1px solid var(--line);padding:10px;overflow:auto}
#dside .grp{margin-top:8px}
#dside .grp h4{margin:6px 0 2px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px}
#dside .ln{display:flex;justify-content:space-between;padding:1px 0;cursor:default}
.valid{padding:6px 8px;border-radius:6px;margin:8px 0;font-weight:600}
.valid.ok{background:#1d3b25;color:#8fe0a5}.valid.bad{background:#3b1d1d;color:#ff9c90}
.fdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fc);vertical-align:middle;margin-right:4px;border:1px solid #000}
.help{max-width:900px;margin:0 auto;line-height:1.55}
.help code{background:#0f1116;padding:1px 4px;border-radius:4px}
.autolist{columns:2;font-size:12px}
@media (max-width:1100px){#gright{width:230px}#preview{height:260px}}

.fbadge.f-stark{color:#111;text-shadow:none}
/* ---------- imagens ---------- */
.card .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:5px;z-index:1;opacity:0}
.card.hasimg .cimg{opacity:1}
.card.plotc .cimg{object-fit:cover}
.card .ov{position:absolute;left:2px;bottom:2px;z-index:3;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none}
.card:not(.hasimg) .ov{display:none}
.ovstr{min-width:22px;height:22px;border-radius:4px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid #000;box-shadow:0 0 4px #000}
.ovstr.up{background:#2f7d43}.ovstr.down{background:#8a2a20}
.ovic{display:flex;gap:1px}
.card .badges,.card .warn,.card.atk::after,.card.def::after{z-index:3}
.card.blank.hasimg .cimg{filter:grayscale(.8)}
.pvimg{display:none;width:100%;max-width:230px;margin:0 auto 8px;border-radius:10px;box-shadow:0 4px 14px #000}
.pvimg.plot{max-width:270px}
.pvimg.ok{display:block}
#preview{height:auto;max-height:58vh}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.card.big{width:120px;height:170px}
.card.big .hd{font-size:10.5px}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;max-width:420px;background:#2a2316;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;box-shadow:0 6px 20px #000;cursor:pointer;line-height:1.4}
#langBtn,#imgBtn{padding:4px 10px;font-size:12px}

/* ---------- v0.5 ---------- */
.ic{font-size:10px;font-weight:400;line-height:1}
.ic.P{background:#2c5aa0}
.modal.sel-modal{right:290px}
@media (max-width:1100px){.modal.sel-modal{right:230px}}
#gright.nolog #log{display:none}
#gright.nolog #preview{max-height:none;flex:1}
#logToggle{margin:4px 8px;padding:3px 8px;font-size:11px;align-self:flex-start}
#gcenter{position:relative}
.infobox{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:min(560px,92%);max-height:60%;overflow:auto;z-index:30;background:#15171ef2;border:2px solid var(--gold);border-radius:12px;padding:14px 18px;box-shadow:0 10px 40px #000c}
.infobox.good{border-color:#46d06a}.infobox.bad{border-color:#e0574a}
.infobox h3{margin:0 0 8px;font-family:'Cinzel',serif;color:var(--gold2);font-size:17px}
.infobox.good h3{color:#7dff9a}.infobox.bad h3{color:#ff8b7e}
.infobox .ilines{font-size:13px;line-height:1.5;margin-bottom:10px}
.infobox .ilines .kill{color:#ff7a6a}.infobox .ilines .pow{color:#c99cf0}.infobox .ilines .gold{color:#e8c46a}.infobox .ilines .ch{color:#ffb4a8}.infobox .ilines .chw{color:#ffd36a;font-weight:600}.infobox .ilines .ev{color:#9fd3ff}
.stat.up{color:#7dff9a;border-color:#2f7d43}.stat.down{color:#ff8b7e}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#toasts .toast{position:static}
.toast.good{border-color:#46d06a}.toast.bad{border-color:#e0574a}
.kwlist{max-width:640px;columns:1}
.kwlist b{color:var(--gold2)}.kwlist p{margin:2px 0 10px;line-height:1.45}
#pauseBtn,#kwBtn,#offBtn{padding:4px 10px;font-size:12px}

/* ---------- telemóvel ---------- */
#menuBtn,#logFab,.ppmore,.mobonly{display:none}
#hdrBtns{display:flex;gap:6px}
#sheet{display:none}
@media (max-width:820px){
  body{font-size:12px}
  header{gap:8px;padding:6px 8px;position:relative}
  header h1{font-size:14px;letter-spacing:1px}
  header nav button{font-size:12px;padding:4px 6px}
  #tagline{display:none}
  #menuBtn{display:block;margin-left:auto;padding:4px 10px;font-size:16px}
  #hdrBtns{display:none;position:absolute;right:6px;top:42px;z-index:70;flex-direction:column;background:#15171e;border:1px solid var(--gold);border-radius:10px;padding:8px;box-shadow:0 8px 24px #000}
  body.menuopen #hdrBtns{display:flex}
  #hdrBtns button{padding:10px 14px;font-size:14px;text-align:left}
  .screen{height:calc(100vh - 41px);height:calc(100dvh - 41px)}
  /* jogo */
  #game{flex-direction:column}
  #gside{width:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:4px;border-right:none;border-bottom:1px solid var(--line);overflow:visible;flex:none}
  #gside .pp{flex:1 1 40%;padding:5px 6px;min-width:0}
  #gside .pp .nm{font-size:12px}
  #gside .pp .stats{margin:3px 0 0;gap:3px}
  #gside .stat{padding:1px 5px;font-size:11px}
  #gside .pp .piles,#gside .pp .mini-plot,#gside .pp .stat[data-code]{display:none}
  #gside .pp.open .piles,#gside .pp.open .mini-plot{display:flex;margin-top:4px}
  #gside .ppmore{display:block;font-size:10px;color:var(--dim);margin-top:2px;cursor:pointer}
  #gside .phasebox{order:-1;flex:1 1 100%;padding:2px 6px;display:flex;justify-content:center;gap:10px;align-items:center}
  #gside .phasebox b{font-size:12px}
  #btnQuit{display:none}
  .mobonly{display:inline-flex;gap:6px;margin-left:auto}
  .pbtns button{padding:3px 10px;font-size:12px}
  #gcenter{flex:1;min-height:0}
  #board{padding:4px;gap:2px}
  #board .row{flex-wrap:nowrap;overflow-x:auto;min-height:96px;gap:4px;-webkit-overflow-scrolling:touch}
  #board .row.locs{min-height:70px}
  #board .row .lbl{display:none}
  #board .slot,#hand .card,.cgrid .card{zoom:.68}
  .divider{min-height:26px;margin:0}
  .chb{font-size:11px;padding:3px 10px}
  #prompt{padding:6px 8px;gap:6px;min-height:0}
  #prompt .txt{flex:1 1 100%;min-width:0;font-size:12px}
  #prompt button{padding:8px 12px;font-size:13px}
  #hand{min-height:0;padding:6px;gap:4px;-webkit-overflow-scrolling:touch}
  #gright{display:none}
  #game.showlog #gright{display:flex;position:fixed;right:0;top:41px;bottom:0;width:86vw;z-index:45;box-shadow:-10px 0 30px #000;background:#0b0c10}
  #game.showlog #preview{display:none}
  #logToggle{display:none}
  #game.showlog::after{content:'';position:fixed;inset:41px 86vw 0 0;z-index:44;background:#0008}
  .infobox{top:6px;width:96%;max-height:70%;padding:10px 12px}
  .modal .box{max-width:96vw;padding:10px}
  .modal.sel-modal{right:0}
  .cgrid{gap:4px}
  .menu button{padding:10px 12px;font-size:14px}
  #toasts{left:8px;right:8px;top:48px;bottom:auto;align-items:stretch}
  .toast{max-width:none}
  /* folha de detalhes da carta */
  #sheet{display:block;position:fixed;inset:0;z-index:80;background:#000a;opacity:0;pointer-events:none;transition:opacity .15s}
  #sheet.open{opacity:1;pointer-events:auto}
  #sheet .sheetbox{position:absolute;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--panel);border-top:2px solid var(--gold);border-radius:14px 14px 0 0;padding:14px 14px 24px}
  #sheet .sheetclose{position:sticky;top:0;float:right;font-size:16px;padding:4px 10px}
  #sheet .pvimg{max-width:62vw}
  /* construtor de decks */
  #decks{flex-direction:column;overflow:auto}
  #dlist{width:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px;flex:none}
  #dlist .di{flex:none;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-color:var(--line)}
  #dlist>.note{display:none}
  #dlist>button{flex:none}
  #pool{flex:none;padding:6px;min-height:60vh}
  #pool .tbl{max-height:60vh}
  #pool table th:nth-child(5),#pool table td:nth-child(5),#pool table th:nth-child(2) small,#pool td small.note{display:none}
  #pool table td,#pool table th{padding:4px 3px}
  .qty button{padding:6px 9px}
  #dside{width:auto;border-left:none;border-top:1px solid var(--line)}
  #dside>.pvbox{display:none}
  .pgrid .card.big{zoom:.75}
  /* lobby / ajuda */
  .wrap{padding:10px}
  .panel{padding:12px}
  .autolist{columns:1}
  .help .panel[style*="sticky"]{display:none}
}
@media (max-width:820px) and (orientation:landscape){
  #gside .pp .stats .stat:nth-child(n+4){display:none}
  #board .slot,#hand .card{zoom:.55}
  #board .row{min-height:78px}
}

/* toque: sem menu "guardar imagem", sem seleção de texto, sem zoom de duplo toque */
.card,.card *,.attc,.slot,#hand,#board,.cgrid,.pgrid,#prompt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card img,.pvimg{-webkit-user-drag:none;user-drag:none}
.card img{pointer-events:none}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pbtns button.on{border-color:#46d06a;color:#7dff9a;background:#173b22}
</style>

function reducerAct(g, c, amt, filter, desc, opts = {}) {
  const p = c.owner;

const AI_BASE = {

  },

  handValue(g, p, c) { if (c.d.t === 'event') return 3 + (c.d.cost === 'X' ? 2 : 0); return (c.d.cost || 0) + (c.d.s || 0) + (c.d.u && g.findDupeTarget(p, c) ? 4 : 0); },

    return p.chars.filter(c => !c.kneel && g.hasIcon(c, type) && !exclude.includes(c)).reduce((s, c) => s + g.str(c), 0);
  },
  attPotential(g, p, type) { return p.chars.filter(c => g.canAttackWith(p, c, type)).reduce((s, c) => s + g.str(c), 0); },
  setupScore(g, p, c, budget) {
    if (g.findDupeTarget(p, c)) return 6;
    if (c.d.t === 'character') return 10 + g.str(c) + (c.d.cost || 0) + AI.iconsCount(g, c) - (c.d.k?.ambush ? 3 : 0);
    if (c.d.t === 'location') return (c.d.m?.income ? 12 : 4) + (c.d.cost || 0);
    if (c.d.t === 'attachment') return c.code === '01035' ? (p.opp.chars.length ? 3 : -1) : (p.chars.some(t => AI.attachScore(g, p, c, t) > 0) ? 3 : -1);
    return -1;
  },
  attachScore(g, p, a, t) {
    if (a.code === '01035') return t.owner !== p ? AI.value(g, t) + (DB[t.code].v ? -5 : 3) : -50;
    if (t.owner !== p) return -50;
    let s = AI.value(g, t);
    const gives = { '01034': 'intrigue', '01036': 'power', '01037': 'military' }[a.code];
    if (gives) s += g.hasIcon(t, gives) ? -6 : 6;

  },
  marshalScore(g, p, c) {
    if (g.findDupeTarget(p, c)) return 9;
    if (c.d.t === 'character') {
      if (c.code === '01095') return 2; // melhor por ambush
      return 10 + g.str(c) + AI.iconsCount(g, c) * 2 + (c.d.cost || 0) + (c.d.m?.income ? 6 : 0);
    }
    if (c.d.t === 'location') { if (c.d.m?.income) return 40; if (c.code === '01038') return 12; if (c.code === '01039') return 25; return 8 + (c.d.cost || 0); }
    if (c.d.t === 'attachment') { const best = Math.max(-50, ...g.attachTargets(p, c).map(t => AI.attachScore(g, p, c, t))); return best > 0 ? 6 + Math.min(best, 8) * 0.3 : -1; }
    return -1;
  },
  reducerScore(g, p, filter, amt, sac) {
    if (g.phase !== 'marshal' || g.activeP !== p) return 0;
    const already = p.reducers.filter(r => r.modes.includes('marshal'));
    const want = p.hand.filter(c => filter(c) && ['character', 'location', 'attachment'].includes(c.d.t) && !g.findDupeTarget(p, c) && AI.marshalScore(g, p, c) > 0 && !g.uniqueBlockedByDead(p, c));
    for (const c of want) {
      const cur = g.costOf(p, c, 'marshal');
      if (cur <= 0) continue;
      if (cur - amt > p.gold) continue;
      if (sac && cur < 4) continue;

  plotScore(g, p, pl) {
    const [inc, ini, claim] = pl.d.p; let s = inc * 1.3 + ini * 0.15 + claim * 2 + Math.random() * 2.5;

    switch (pl.code) {
      case '01010': s += p.hand.length < 4 ? 4 : -1; break;
      case '01026': s += (q.chars.length - p.chars.length >= 2) ? 8 : -12; break;
      case '01015': s += q.chars.length ? 1 : -3; break;
      case '01020': s += [...p.hand, ...p.discard].some(c => c.d.t === 'character' && (c.d.cost || 0) >= 4 && (c.d.cost || 0) <= 5) ? 5 : -6; break;
      case '01022': case '01006': s += 2; break;
      case '01011': s += 2; break;
      case '01013': s += q.hand.length > 2 ? 2 : -1; break;
      case '01007': s += q.chars.length * 0.9; break;
      case '01012': s -= 4; break;
      case '01003': case '01014': s -= 1; break;
      case '01005': s += p.chars.filter(c => g.hasIcon(c, 'military')).length * 0.5; break;
      case '01016': s -= p.hand.filter(c => c.d.t !== 'character').length * 0.8; break;

  challengeScore(g, p, t) {
    const q = p.opp;
    const myA = AI.attPotential(g, p, t);
    const stealthers = p.chars.filter(c => g.canAttackWith(p, c, t) && g.hasKw(c, 'stealth')).length;
    const defs = q.chars.filter(c => !c.kneel && g.hasIcon(c, t)).sort((a, b) => g.str(b) - g.str(a));
    const D = defs.slice(stealthers).reduce((s, c) => s + g.str(c), 0);
    if (myA <= 0) return 0;
    const pri = { military: 3, power: 2, intrigue: 2.5 }[t];
    if (t === 'intrigue' && !q.hand.length && !p.locs.some(l => l.code === '01098')) return D === 0 ? 4 : 0.5;
    if (t === 'military' && !q.chars.length) return D === 0 ? 3 : 0;
    if (D === 0) return 20 + pri;
    if (myA > D) return 10 + pri;
    if (myA === D) return 6 + pri;

  },
  pickAttackers(g, p, type, cands, jousting) {
    const q = p.opp;
    const sorted = [...cands].sort((a, b) => g.str(b) - g.str(a));
    if (jousting) return [sorted[0]];
    const stealth = sorted.filter(c => g.hasKw(c, 'stealth')).length;
    const defs = q.chars.filter(c => !c.kneel && g.hasIcon(c, type)).sort((a, b) => g.str(b) - g.str(a));
    const D = defs.slice(stealth).reduce((s, c) => s + g.str(c), 0);
    if (D === 0) { // um atacante basta; prefere quem não ajoelha / renown
      const best = [...sorted].sort((a, b) => ((ab(b).noKneelAttack && ab(b).noKneelAttack(g, b, type)) ? 5 : 0) + (g.hasKw(b, 'renown') ? 3 : 0) - ((ab(a).noKneelAttack && ab(a).noKneelAttack(g, a, type)) ? 5 : 0) - (g.hasKw(a, 'renown') ? 3 : 0));
      const r = [best[0]];
      for (const c of sorted) if (!r.includes(c) && (g.hasKw(c, 'renown') || (ab(c).noKneelAttack && ab(c).noKneelAttack(g, c, type)))) r.push(c);
      return r;
    }
    const r = []; let s = 0;
    for (const c of sorted) { r.push(c); s += g.str(c); if (s > D) break; }
    // incluir quem não ajoelha (grátis)
    for (const c of sorted) if (!r.includes(c) && ab(c).noKneelAttack && ab(c).noKneelAttack(g, c, type)) r.push(c);
    return r;
  },
  stealthScore(g, p, x, type) { return (!x.kneel && g.hasIcon(x, type)) ? g.str(x) + 5 : 0.1; },
  pickDefenders(g, p, ch, dc, jousting) {
    const A = g.sumStr(ch.attackers);
    const sorted = [...dc].sort((a, b) => g.str(b) - g.str(a));
    if (jousting) return g.str(sorted[0]) > A ? [sorted[0]] : [];
    let r = [], s = 0;
    for (const c of sorted) { r.push(c); s += g.str(c); if (s > A) break; }
    if (s > A) {
      // remover desnecessários (menores primeiro)
      for (const c of [...r].reverse()) if (s - g.str(c) > A) { r = r.filter(x => x !== c); s -= g.str(c); }
      const claimHurts = ch.type === 'military' || ch.type === 'power' || p.hand.length > 1;
      if (claimHurts || Math.random() < 0.6) return r;
      return [];
    }
    // não ganha: evitar unopposed com uma personagem barata
    const cheap = sorted.filter(c => g.str(c) >= 1).sort((a, b) => AI.value(g, a) - AI.value(g, b))[0];
    if (cheap && AI.value(g, cheap) < 7 && Math.random() < 0.5) return [cheap];
    return [];
  },
  ambushScore(g, p, c, ctx) {
    if (!ctx.beforeChallenge) return 0;
    if (c.code === '01095') return (p.hand.length - 1 > p.opp.hand.length && p.opp.chars.length) ? 25 : 0;
    if (c.d.t === 'character') return (CH_TYPES.some(t => g.challengeAllowed(p, t) || !(p.chDone[t])) && g.hasIcon(c, 'military')) ? 7 + g.str(c) : 2;
    if (c.d.t === 'attachment') return 3;
    return 0;
  },
  standScore(g, p, ctx) {
    // levantar personagens: depois de atacar, para defender/dominance
    if (g.phase === 'challenges' && ctx.beforeChallenge && g.activeP === p) return 4;
    if (g.phase === 'dominance') return 6;
    return 0;
  },
  pumpScore(g, p, ch, n) {
    if (!ch) return 0;
    const A = g.sumStr(ch.attackers), D = g.sumStr(ch.defenders);
    if (ch.att === p) { if (A < D && A + n >= D) return 30; return A >= D && A - D < 5 && A - D + n >= 5 ? 8 : 0; }
    if (D <= A && D + n > A) return 30;
    return 0;
  },
  wicScore(g, p) { const ch = g.ch; if (!ch) return 0; const A = g.sumStr(ch.attackers), D = g.sumStr(ch.defenders); return A >= D && A > 0 ? 15 : 0; },
  hmrScore(g, p, ctx) {
    if (g.phase === 'challenges' && ctx.beforeChallenge) { const best = p.hand.filter(c => c.d.t === 'character' && c.d.f === 'lannister').map(c => g.str(c)).sort((a, b) => b - a)[0] || 0; return best >= 4 && CH_TYPES.some(t => g.challengeAllowed(p, t)) ? 9 : 0; }
    return 0;
  },
  tidflScore(g, p) {
    const t = p.opp.chars.filter(c => (c.d.cost || 0) <= p.gold && (c.d.cost || 0) >= 4);
    return t.length ? 12 : 0;
  },
  greyWindScore(g, p, gw, targets, ctx) {
    const enemy = targets.filter(x => x.owner !== p);
    if (!enemy.length) return 0;
    const best = Math.max(...enemy.map(x => AI.value(g, x)));
    if (ctx.ch) return enemy.some(x => participating(g, x) && x.owner === ctx.ch.att) ? 20 : 0;
    if (ctx.beforeChallenge && g.activeP === p) return (p.chDone.military || !g.challengeAllowed(p, 'military')) ? 10 + best : (best >= 6 ? 8 : 0);

  cancelScore(g, q, ev) { return ev.owner !== q ? 5 + (ev.d.cost || 0) : 0; },
  varysScore(g, p) {

    const theirs = p.opp.chars.reduce((s, c) => s + AI.value(g, c), 0);
    return theirs > mine + 10 ? 1 : 0;
  },
};


class AICtrl {
  constructor(delay, legacy) { this.delay = delay || 0; this.isAI = true; this.legacy = !!legacy; }
  async wait() { if (this.delay) await sleep(this.delay); }
  async chooseCards(g, p, o) {
    await this.wait();
    if (o.aiPick) return o.aiPick();
    const sc = o.cands.map(c => ({ c, s: o.ai ? o.ai(c) : 1 })).sort((a, b) => b.s - a.s);
    const r = [];
    for (const x of sc) { if (r.length >= o.max) break; if (r.length < o.min || x.s > 0) r.push(x.c); }
    return r;
  }
  async chooseOption(g, p, o) {
    await this.wait();
    let best = o.options[0], bs = -Infinity;
    for (const op of o.options) { const s = o.ai ? o.ai(op) : 0; if (s > bs) { bs = s; best = op; } }
    return best.value;
  }
  async actionWindow(g, p, o) {
    const items = [];
    for (const a of o.actions || []) items.push({ a, s: typeof a.ai === 'number' ? a.ai : 0 });
    for (const b of o.buttons || []) items.push({ b, s: b.ai || 0 });
    items.sort((x, y) => y.s - x.s);
    const top = items[0];
    if (!top || top.s <= 0) return null;
    await this.wait();
    if (top.a) return top.a;
    return { button: top.b.value };
  }
}

const AIK = { first: 'calc', ratio: 2, defK: 0.8, oppK: 0.7, baseMarshal: false, setup: true, plot: true, reserve: true, aura: true, daenCost: true };
const AI_NEW = {
  powW(g, p) { const t = g.totalPower(p); return 3 + (t >= 10 ? 1.5 : 0) + (t >= 13 ? 2 : 0); },
  noKneel(g, c, t) { return !!(ab(c).noKneelAttack && !g.blank(c) && ab(c).noKneelAttack(g, c, t)); },
  remaining(g, p, t) { return Math.max(0, g.maxOfType(p, t) - (p.chDone[t] || 0)); },
  // o adversário ainda vai atacar nesta fase?
  oppStillAttacks(g, p) { return g.phase === 'challenges' && g.first === p; },
  // eu ainda vou atacar nesta fase (estou a defender antes do meu turno)?
  iStillAttack(g, p) { return g.phase === 'challenges' && g.first !== p && g.activeP !== p; },
  charValue(g, c) { return c.dupes.length ? 2 : AI_BASE.value(g, c); },
  // custo de ajoelhar c para atacar no tipo t
  attackUseCost(g, p, c, t) {
    if (AI_NEW.noKneel(g, c, t)) return 0;
    let cost = g.str(c) * 0.12;

  return s;
}

const yesNo = () => [{ label: LX('Sim', 'Yes'), value: true }, { label: LX('Não', 'No'), value: false }];
const isStormborn = c => c.d.tr.includes('Stormborn');
const gainGoldAct = (g, c, n, extraCond) => {
  const p = c.owner;
  if (c.kneel || g.phase !== 'marshal' || g.activeP !== p || (extraCond && !extraCond())) return [];
  const need = p.hand.some(x => ['character', 'location', 'attachment'].includes(x.d.t) && !g.findDupeTarget(p, x) && g.costOf(p, x, 'marshal') > p.gold && g.costOf(p, x, 'marshal') <= p.gold + n && AI.marshalScore(g, p, x) > 0);
  return [{ label: LX(`${g.cn(c)}: ajoelhar para ganhar ${n} ouro`, `${g.cn(c)}: kneel to gain ${n} gold`), ai: need ? 58 : 1.5,
    run: async () => { c.kneel = true; p.gold += n; g.log(LX(`${p.name} ajoelha ${g.cn(c)} e ganha ${n} ouro.`, `${p.name} kneels ${g.cn(c)} and gains ${n} gold.`), 'gold'); } }];
};
// personagem participante leva -X STR até ao fim da fase e morre se ficar com 0
async function burn(g, p, prompt, amt, filter) {
  const t = g.allChars().filter(c => participating(g, c) && (!filter || filter(c)));
  if (!t.length) return null;
  const [c] = await p.ctrl.chooseCards(g, p, { prompt, cands: t, min: 1, max: 1, ai: x => x.owner === p ? -50 : (g.str(x) <= amt ? 20 + AI.value(g, x) : g.str(x)) });
  c.ph -= amt; c.flags.dieAt0 = g.phase;
  g.log(LX(`${g.cn(c)} leva −${amt} STR até ao fim da fase.`, `${g.cn(c)} gets −${amt} STR until the end of the phase.`));
  await g.checkZero();
  return c;
}
// valor para a IA de reduzir STR numa personagem participante
const burnScore = (g, p, amt, filter) => {
  const ch = g.ch; if (!ch) return 0;
  const enemy = g.allChars().filter(c => participating(g, c) && c.owner !== p && (!filter || filter(c)));
  if (!enemy.length) return 0;
  if (enemy.some(c => g.str(c) <= amt)) return 25;
  const mySide = ch.att === p ? 'att' : 'def';
  const A = g.sideStr(ch, 'att'), D = g.sideStr(ch, 'def');
  if (mySide === 'att' && A < D && A >= D - amt) return 22;
  if (mySide === 'def' && D <= A && D > A - amt) return 22;
  return 0;
};

    onLeave: async (g, c) => { const p = c.owner; const t = g.allChars().flatMap(x => x.att).filter(a => a.parent !== c); if (!t.length) return; const [a] = await p.ctrl.chooseCards(g, p, { prompt: LX('Viserys: escolhe um anexo para descartar (ou nenhum)', 'Viserys: choose an attachment to discard (or none)'), cands: t, min: 0, max: 1, ai: y => y.owner !== p ? 5 + (y.d.cost || 0) : -5 }); if (a) await g.discardFromPlay(a); } },
  '01169': { pt: 'Ação: sacrifica a Handmaiden para escolher e levantar uma personagem Lady.', en: 'Action: sacrifice Handmaiden to choose and stand a Lady character.',
    actions: (g, c, ctx) => { const p = c.owner; const t = g.allChars().filter(x => x.kneel && x.d.tr.includes('Lady') && g.canStand(x)); if (!t.length || ctx.reaction) return [];
      return [{ label: LX('Handmaiden: sacrificar para levantar uma Lady', 'Handmaiden: sacrifice to stand a Lady'), ai: t.some(x => x.owner === p && x.code === '01160') && (g.phase === 'dominance' || (ctx.beforeChallenge && g.activeP === p)) ? 7 : 0,
        run: async () => { const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a Lady a levantar', 'Choose the Lady to stand'), cands: t, min: 1, max: 1, ai: y => y.owner === p ? AI.value(g, y) : -10 }); await g.sacrifice(c); x.kneel = false; g.log(LX(`${g.cn(x)} levanta-se.`, `${g.cn(x)} stands.`)); } }]; } },
  '06113': { pt: 'Reação: depois de ganhares um desafio como atacante por 5 ou mais STR, põe os Freedmen em jogo a partir do teu descarte.', en: 'Reaction: after you win a challenge as attacker by 5 or more STR, put Freedmen into play from your discard pile.',
    fromDiscardAfterWin: async (g, c, ch) => { const p = c.owner; if (ch.winner !== p || ch.att !== p || ch.diff < 5 || g.uniqueBlockedByDead(p, c)) return; g.log(LX('Freedmen regressa do descarte.', 'Freedmen returns from the discard pile.')); await g.putIntoPlay(p, c, 'put'); } },
  '01168': { pt: 'Sem anexos exceto Weapon.', en: 'No attachments except Weapon.', attachOnly: 'Weapon' },
  '01166': { pt: 'Sem anexos. As tuas personagens Stormborn ganham stealth.', en: 'No attachments. Each Stormborn character you control gains stealth.', noAttach: true, grantKw: (g, o, c) => isStormborn(c) ? { stealth: 1 } : null },
  '01165': { pt: 'Renown. Reação forçada: depois de ganhares um desafio em que participa, recebe 1 marcador de traição. Com 3 marcadores, é sacrificado.', en: 'Renown. Forced reaction: after you win a challenge he took part in, he gets 1 betrayal token. At 3 tokens he is sacrificed.',
    afterWin: async (g, c, ch) => { if (ch.winner !== c.owner || !participating(g, c)) return; c.tokens = (c.tokens || 0) + 1; g.log(LX(`Ser Jorah recebe um marcador de traição (${c.tokens}).`, `Ser Jorah gets a betrayal token (${c.tokens}).`)); if (c.tokens >= 3) await g.sacrifice(c); } },
  '10035': { pt: 'Interrupção: quando a Missandei é descartada da tua mão ou do baralho, entra em jogo em vez de ir para o descarte.', en: 'Interrupt: when Missandei is discarded from your hand or deck, put her into play instead.', fromDiscardToPlay: true },
  '08053': { pt: 'Reação: depois de ganhares um desafio, descarta 1 carta da mão para uma Lord ou Lady participante ganhar 1 poder.', en: 'Reaction: after you win a challenge, discard 1 card from your hand to have a participating Lord or Lady gain 1 power.',
    afterWin: async (g, c, ch) => { const p = c.owner; if (ch.winner !== p || !p.hand.length) return; const t = (ch.att === p ? ch.attackers : ch.defenders).filter(x => x.zone === 'chars' && x.owner === p && isLordLady(x)); if (!t.length) return;
      const ok = await p.ctrl.chooseOption(g, p, { prompt: LX('Jhiqui: descartar 1 carta para uma Lord/Lady ganhar 1 poder?', 'Jhiqui: discard 1 card for a Lord/Lady to gain 1 power?'), options: yesNo(), ai: o => o.value === (p.hand.length >= 3 || p.hand.some(x => x.code === '10035')) ? 1 : 0, card: c });
      if (!ok) return; const [d] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a carta a descartar', 'Choose the card to discard'), cands: [...p.hand], min: 1, max: 1, ai: y => (y.code === '10035' ? 50 : 0) - AI.handValue(g, p, y) }); g.discardFromHand(p, d); g.log(LX(`${p.name} descarta ${g.cn(d)}.`, `${p.name} discards ${g.cn(d)}.`)); await g.flushPending();
      const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a Lord/Lady', 'Choose the Lord/Lady'), cands: t.filter(y => y.zone === 'chars'), min: 1, max: 1, ai: y => AI.value(g, y) }); if (x) g.gainPower(p, 1, x); } },
  '01164': { pt: 'Sem anexos. Reação: depois de ganhares um desafio com uma personagem Stormborn tua a participar, levanta uma Stormborn (1 vez por fase).', en: 'No attachments. Reaction: after you win a challenge in which a Stormborn character you control took part, stand a Stormborn character (once per phase).', noAttach: true,
    afterWin: (g, c, ch) => { const p = c.owner; if (ch.winner !== p || c.flags.rhaegal === g.phase) return; if (!(ch.att === p ? ch.attackers : ch.defenders).some(x => x.owner === p && isStormborn(x))) return; const t = p.chars.filter(x => isStormborn(x) && x.kneel && g.canStand(x)); if (!t.length) return; c.flags.rhaegal = g.phase; t[0].kneel = false; g.log(LX(`Rhaegal: ${g.cn(t[0])} levanta-se.`, `Rhaegal: ${g.cn(t[0])} stands.`)); } },
  '01161': { pt: 'Sem anexos. As tuas personagens Stormborn ganham renown.', en: 'No attachments. Each Stormborn character you control gains renown.', noAttach: true, grantKw: (g, o, c) => isStormborn(c) ? { renown: 1 } : null },
  '01171': { pt: 'Sem anexos exceto Weapon. Enquanto ataca, cada personagem defensora tem −1 STR.', en: 'No attachments except Weapon. While Unsullied is attacking, each defending character gets −1 STR.', attachOnly: 'Weapon',
    strAura: (g, u, c) => g.ch && g.ch.attackers.includes(u) && g.ch.defenders.includes(c) ? -1 : 0 },
  '07035': { pt: 'Sem anexos. −1 STR por cada carta na tua mão.', en: 'No attachments. −1 STR for each card in your hand.', noAttach: true, str: (g, c) => -c.owner.hand.length },
  '09037': { pt: 'Ação: descarta 2 cartas Targaryen da mão para pôr o Qotho em jogo a partir da mão.', en: 'Action: discard 2 Targaryen cards from your hand to put Qotho into play from your hand.',
    handActions: (g, c, ctx) => { const p = c.owner; if (ctx.reaction || g.uniqueBlockedByDead(p, c)) return []; const t = p.hand.filter(x => x !== c && x.d.f === 'targaryen'); if (t.length < 2) return [];
      const ai = (ctx.beforeChallenge && g.activeP === p && p.gold < 5) || (g.phase === 'marshal' && g.activeP === p && p.gold < 5 && p.hand.length >= 5) ? 9 : 0;
      return [{ label: LX('Qotho: descartar 2 cartas Targaryen para o pôr em jogo', 'Qotho: discard 2 Targaryen cards to put him into play'), ai, run: async () => { const d = await p.ctrl.chooseCards(g, p, { prompt: LX('Qotho: escolhe 2 cartas Targaryen para descartar', 'Qotho: choose 2 Targaryen cards to discard'), cands: t, min: 2, max: 2, ai: y => (y.code === '10035' ? 50 : 0) - AI.handValue(g, p, y) }); for (const x of d) g.discardFromHand(p, x); g.log(LX(`${p.name} descarta ${d.map(x => g.cn(x)).join(', ')}.`, `${p.name} discards ${d.map(x => g.cn(x)).join(', ')}.`)); await g.putIntoPlay(p, c, 'put'); await g.flushPending(); } }]; } },
  '05035': { pt: 'Reação: depois de ganhares um desafio em que participa, se tens menos cartas na mão do que o adversário, levanta-o.', en: 'Reaction: after you win a challenge he took part in, if you have fewer cards in hand than the loser, stand him.',
    afterWin: (g, c, ch) => { const p = c.owner; if (ch.winner === p && participating(g, c) && c.kneel && p.hand.length < ch.loser.hand.length) { c.kneel = false; g.log(LX('Ser Barristan Selmy levanta-se.', 'Ser Barristan Selmy stands.')); } } },
  '01163': { pt: 'Ação: paga 2 ouro para escolher e levantar uma personagem (1 vez por fase).', en: 'Action: pay 2 gold to choose and stand a character (once per phase).',
    actions: (g, c, ctx) => { const p = c.owner; if (p.gold < 2 || c.flags.illyrio === g.phase || ctx.reaction) return []; const t = p.chars.filter(x => x.kneel && g.canStand(x)); if (!t.length) return [];
      const ai = (ctx.beforeChallenge && g.activeP === p && t.some(x => g.str(x) >= 4)) || g.phase === 'dominance' ? 6 : 0;
      return [{ label: LX('Magister Illyrio: levantar uma personagem (2 ouro)', 'Magister Illyrio: stand a character (2 gold)'), ai, run: async () => { const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a personagem a levantar', 'Choose the character to stand'), cands: t, min: 1, max: 1, ai: y => g.str(y) }); p.gold -= 2; c.flags.illyrio = g.phase; x.kneel = false; g.log(LX(`Illyrio: ${g.cn(x)} levanta-se.`, `Illyrio: ${g.cn(x)} stands.`)); } }]; } },
  '01162': { pt: 'Renown. Podes iniciar um desafio Militar adicional.', en: 'Renown. You may initiate an extra Military challenge.' },
  '06053': { pt: 'Sem anexos exceto Weapon. Ação: durante um desafio em que o Grey Worm ataca, uma personagem defensora leva −3 STR até ao fim do desafio (1 vez por desafio).', en: 'No attachments except Weapon. Action: during a challenge in which Grey Worm is attacking, a defending character gets −3 STR until the end of the challenge (once per challenge).', attachOnly: 'Weapon',
    actions: (g, c, ctx) => { const p = c.owner, ch = g.ch; if (!ch || !ch.attackers.includes(c) || ch.greyWorm || !ch.defenders.length || ctx.reaction) return [];
      return [{ label: LX('Grey Worm: −3 STR a um defensor', 'Grey Worm: −3 STR to a defender'), ai: 20, run: async () => { const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Grey Worm: escolhe o defensor', 'Grey Worm: choose the defender'), cands: [...ch.defenders], min: 1, max: 1, ai: y => g.str(y) }); x.tmp -= 3; ch.greyWorm = true; g.log(LX(`${g.cn(x)} leva −3 STR.`, `${g.cn(x)} gets −3 STR.`)); } }]; } },
  '01160': { pt: 'Insight. Enquanto estiver em pé, cada personagem do adversário que participe num desafio contra ti tem −1 STR.', en: 'Insight. While standing, each character participating on an opponent\'s side in a challenge against you gets −1 STR.',
    strAura: (g, d, c) => !d.kneel && g.ch && g.ch.def === d.owner && c.owner !== d.owner && g.ch.attackers.includes(c) ? -1 : 0 },

  // ---------- TARGARYEN: EVENTOS ----------
  '09044': { pt: 'Interrupção: quando um evento do adversário seria iniciado, ele escolhe: cancelar os efeitos ou tu compras 2 cartas.', en: "Interrupt: when an opponent's event would initiate, that opponent chooses: cancel its effects, or you draw 2 cards." },
  '01178': { pt: 'Ação: levanta uma personagem Targaryen única tua. No fim da fase, se ainda estiver em jogo, volta para a mão.', en: 'Action: stand a unique Targaryen character you control. At the end of the phase, if it is still in play, return it to your hand.',
    ev: { timing: 'action', cond: (g, p, ctx) => !ctx.reaction && p.chars.some(c => c.d.u && c.d.f === 'targaryen' && c.kneel && g.canStand(c)), ai: (g, p, ctx) => (g.phase === 'dominance' || (ctx.beforeChallenge && g.activeP === p)) && p.chars.some(c => c.d.u && c.d.f === 'targaryen' && c.kneel && g.str(c) >= 4 && (c.d.cost || 0) <= 4) ? 5 : 0,
      run: async (g, p) => { const t = p.chars.filter(c => c.d.u && c.d.f === 'targaryen' && c.kneel && g.canStand(c)); const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX('Waking the Dragon: escolhe a personagem', 'Waking the Dragon: choose the character'), cands: t, min: 1, max: 1, ai: x => g.str(x) }); c.kneel = false; const tok = Math.random(); c.flags.wtd = tok; g.log(LX(`Waking the Dragon: ${g.cn(c)} levanta-se, mas volta à mão no fim desta fase.`, `Waking the Dragon: ${g.cn(c)} stands, but returns to hand at the end of this phase.`), 'ev'); g.endOfPhase.push(async () => { if (c.zone === 'chars' && c.flags.wtd === tok) { g.log(LX(`Waking the Dragon: fim da fase, ${g.cn(c)} volta à mão.`, `Waking the Dragon: end of phase, ${g.cn(c)} returns to hand.`), 'ev'); await g.returnToHand(c); } }); } } },
  '03036': { pt: 'Ação: cada personagem participante que não seja Dragon leva −1 STR até ao fim do desafio.', en: 'Action: each participating non-Dragon character gets −1 STR until the end of the challenge.',
    ev: { timing: 'action', cond: (g, p, ctx) => !!g.ch && !ctx.reaction && !g.ch.dragonSight, ai: (g, p) => { const ch = g.ch; const side = c => ch.attackers.includes(c) ? 'att' : 'def'; let dA = 0, dD = 0; for (const c of [...ch.attackers, ...ch.defenders]) if (!c.d.tr.includes('Dragon')) { if (side(c) === 'att') dA++; else dD++; } const A = g.sideStr(ch, 'att') - dA, D = g.sideStr(ch, 'def') - dD; const mine = ch.att === p; const before = mine ? g.sideStr(ch, 'att') >= g.sideStr(ch, 'def') : g.sideStr(ch, 'def') > g.sideStr(ch, 'att'); const after = mine ? A >= D : D > A; return !before && after ? 20 : 0; },
      run: async (g, p) => { g.ch.dragonSight = true; for (const c of [...g.ch.attackers, ...g.ch.defenders]) if (!c.d.tr.includes('Dragon')) c.tmp -= 1; g.log(LX('Dragon Sight: personagens que não são Dragon levam −1 STR.', 'Dragon Sight: non-Dragon characters get −1 STR.')); } } },
  '01177': { pt: 'Ação de desafios: baralha uma personagem Targaryen única da tua dead pile no baralho. Se for Hatchling, podes pô-la em jogo.', en: 'Challenges action: shuffle a unique Targaryen character from your dead pile into your deck. If it is a Hatchling, you may put it into play instead.',
    ev: { timing: 'action', cond: (g, p, ctx) => g.phase === 'challenges' && !ctx.reaction && p.dead.some(c => c.d.u && c.d.f === 'targaryen'), ai: (g, p, ctx) => ctx.beforeChallenge && g.activeP === p ? (p.dead.some(c => c.d.tr.includes('Hatchling')) ? 12 : 3) : 0,
      run: async (g, p) => { const t = p.dead.filter(c => c.d.u && c.d.f === 'targaryen'); const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX('Fire and Blood: escolhe a personagem na dead pile', 'Fire and Blood: choose the character in your dead pile'), cands: t, min: 1, max: 1, ai: x => (x.d.tr.includes('Hatchling') ? 10 : 0) + (x.d.cost || 0), modal: true });
        g.removeFromZone(c);
        if (c.d.tr.includes('Hatchling') && !g.uniqueBlockedByDead(p, c)) { const v = await p.ctrl.chooseOption(g, p, { prompt: LX(`Pôr ${g.cn(c)} em jogo?`, `Put ${g.cn(c)} into play?`), options: yesNo(), ai: o => o.value ? 1 : 0 }); if (v) { c.zone = 'hand'; p.hand.push(c); await g.putIntoPlay(p, c, 'put'); return; } }
        c.zone = 'deck'; p.deck.push(c); shuffle(p.deck); g.log(LX(`${g.cn(c)} é baralhada no baralho.`, `${g.cn(c)} is shuffled into the deck.`)); } } },
  '01176': { pt: 'Ação: ajoelha uma Dragon ou a Daenerys Targaryen para uma personagem participante levar −4 STR até ao fim da fase; morre se ficar com STR 0.', en: 'Action: kneel a Dragon character or Daenerys Targaryen; a participating character gets −4 STR until the end of the phase and is killed if its STR is 0.',
    ev: { timing: 'action', cond: (g, p, ctx) => !!g.ch && !ctx.reaction && p.chars.some(c => !c.kneel && (c.d.tr.includes('Dragon') || c.d.n === 'Daenerys Targaryen')), ai: (g, p) => burnScore(g, p, 4),
      run: async (g, p) => { const k = p.chars.filter(c => !c.kneel && (c.d.tr.includes('Dragon') || c.d.n === 'Daenerys Targaryen')); const [d] = await p.ctrl.chooseCards(g, p, { prompt: LX('Dracarys!: escolhe a Dragon/Daenerys a ajoelhar', 'Dracarys!: choose the Dragon/Daenerys to kneel'), cands: k, min: 1, max: 1, ai: x => (participating(g, x) ? 5 : 0) - g.str(x) }); d.kneel = true; await burn(g, p, LX('Dracarys!: escolhe a personagem participante', 'Dracarys!: choose the participating character'), 4); } } },
  '08114': { pt: 'Ação de dominance: cada jogador pode baralhar a mão (com pelo menos 1 carta) no baralho; quem o fizer compra 5 cartas.', en: 'Dominance action: each player may shuffle their hand (of at least 1 card) into their deck; each who does draws 5 cards.',
    ev: { timing: 'action', cond: (g, p, ctx) => g.phase === 'dominance' && !ctx.reaction, ai: (g, p) => p.hand.length <= 2 ? 10 : 0,
      run: async (g, p) => { for (const q of g.order()) { if (!q.hand.length) continue; const v = await q.ctrl.chooseOption(g, q, { prompt: LX('To Go Forward: baralhar a tua mão e comprar 5 cartas?', 'To Go Forward: shuffle your hand into your deck and draw 5?'), options: yesNo(), ai: o => o.value === (q.hand.length < 5) ? 1 : 0 }); if (!v) continue; for (const c of [...q.hand]) { g.removeFromZone(c); c.zone = 'deck'; q.deck.push(c); } shuffle(q.deck); g.log(LX(`${q.name} baralha a mão e compra 5.`, `${q.name} shuffles their hand in and draws 5.`)); g.draw(q, 5); } } } },
  '08034': { pt: 'Ação de desafios: descarta outra carta Targaryen da mão para uma personagem participante levar −3 STR até ao fim da fase; morre se ficar com STR 0.', en: 'Challenges action: discard another Targaryen card from your hand; a participating character gets −3 STR until the end of the phase and is killed if its STR is 0.',
    ev: { timing: 'action', cond: (g, p, ctx) => !!g.ch && !ctx.reaction && p.hand.filter(c => c.d.f === 'targaryen' && c.code !== '08034').length >= 1, ai: (g, p) => burnScore(g, p, 3),
      run: async (g, p, e) => { const t = p.hand.filter(c => c.d.f === 'targaryen' && c !== e); if (!t.length) return; const [d] = await p.ctrl.chooseCards(g, p, { prompt: LX('Consuming Flames: escolhe a carta Targaryen a descartar', 'Consuming Flames: choose the Targaryen card to discard'), cands: t, min: 1, max: 1, ai: y => (y.code === '10035' ? 50 : 0) - AI.handValue(g, p, y) }); g.discardFromHand(p, d); g.log(LX(`${p.name} descarta ${g.cn(d)}.`, `${p.name} discards ${g.cn(d)}.`)); await g.flushPending(); await burn(g, p, LX('Consuming Flames: escolhe a personagem participante', 'Consuming Flames: choose the participating character'), 3); } } },

  // ---------- TARGARYEN: ANEXO E LOCAIS ----------
  '06074': { pt: 'Só personagem Targaryen única. +1 STR por cada personagem tua com custo impresso ≤ 2. Reação: quando a personagem é declarada como atacante, põe em jogo da mão uma personagem com custo impresso ≤ 2.', en: 'Unique Targaryen character only. +1 STR for each character you control with printed cost 2 or lower. Reaction: after the attached character is declared as an attacker, put a character with printed cost 2 or lower into play from your hand.',
    attachOk: (g, a, t) => !!t.d.u && t.d.f === 'targaryen', attStr: (g, a) => a.owner.chars.filter(x => (x.d.cost || 0) <= 2).length,
    afterAttackersDeclared: async (g, a, ch) => { const p = a.owner; if (!a.parent || !ch.attackers.includes(a.parent)) return; const t = p.hand.filter(x => x.d.t === 'character' && (x.d.cost || 0) <= 2 && !g.uniqueBlockedByDead(p, x)); if (!t.length) return;
      const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Breaker of Chains: pôr em jogo uma personagem com custo ≤ 2 (ou nenhuma)', 'Breaker of Chains: put a character with cost ≤ 2 into play (or none)'), cands: t, min: 0, max: 1, ai: y => 2 + g.str(y) }); if (x) await g.putIntoPlay(p, x, 'put'); } },
  '01175': { pt: 'Limited. Ação de marshaling: ajoelha para reduzir em 1 o custo da próxima carta Targaryen.', en: 'Limited. Marshaling action: kneel so your next Targaryen card costs 1 less.',
    actions: (g, c) => reducerAct(g, c, 1, x => x.d.f === 'targaryen', LX('carta Targaryen', 'Targaryen card')) },
  '06038': { pt: 'Limited. Ação de marshaling: ajoelha para reduzir em 1 o custo da próxima personagem única (2 se o custo impresso for 6 ou mais).', en: 'Limited. Marshaling action: kneel so your next unique character costs 1 less (2 if its printed cost is 6 or higher).',
    actions: (g, c) => { const r = reducerAct(g, c, 1, x => x.d.t === 'character' && !!x.d.u, LX('personagem única', 'unique character')); if (r.length) { const run = r[0].run; r[0].run = async () => { await run(); const red = c.owner.reducers[c.owner.reducers.length - 1]; red.amt = x => (x.d.cost || 0) >= 6 ? 2 : 1; }; } return r; } },
  '06014': { pt: 'Limited. Ação de marshaling: ajoelha para ganhar 1 ouro (2 se o adversário tiver 4 ou mais personagens na dead pile).', en: 'Limited. Marshaling action: kneel to gain 1 gold (2 if an opponent has 4 or more characters in their dead pile).',
    actions: (g, c) => gainGoldAct(g, c, c.owner.opp.dead.filter(x => x.d.t === 'character').length >= 4 ? 2 : 1) },
  '10042': { pt: 'Limited. Ação de dominance: ajoelha e sacrifica para descartar um local não-limited com custo impresso ≤ 3. +1 Income.', en: 'Limited. Dominance action: kneel and sacrifice it to discard a non-limited location with printed cost 3 or lower. +1 Income.',
    actions: (g, c) => { const p = c.owner; if (c.kneel || g.phase !== 'dominance') return []; const t = g.players.flatMap(q => q.locs).filter(l => !l.d.k?.limited && (l.d.cost || 0) <= 3 && l !== c); if (!t.length) return [];
      return [{ label: LX('Jade Sea Dromond: descartar um local', 'Jade Sea Dromond: discard a location'), ai: t.some(l => l.owner !== p && (l.d.cost || 0) >= 2) ? 7 : 0, run: async () => { c.kneel = true; await g.sacrifice(c); const [l] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe o local a descartar', 'Choose the location to discard'), cands: t.filter(x => x.zone === 'locs'), min: 1, max: 1, ai: y => y.owner !== p ? 5 + (y.d.cost || 0) : -10 }); if (l) await g.discardFromPlay(l); } }]; } },

    afterWin: async (g, l, ch) => { const p = l.owner; if (ch.winner !== p || !ch.unopposed || (l.flags.gk || 0) >= 2) return; l.flags.gk = (l.flags.gk || 0) + 1; const v = await p.ctrl.chooseOption(g, p, { prompt: LX('Great Kraken: comprar 1 carta ou ganhar 1 poder?', 'Great Kraken: draw 1 card or gain 1 power?'), options: [{ label: LX('Ganhar 1 poder', 'Gain 1 power'), value: 'p' }, { label: LX('Comprar 1', 'Draw 1'), value: 'd' }], ai: o => o.value === 'p' ? 1 : 0 }); if (v === 'p') g.gainPower(p, 1); else { g.log('Great Kraken:'); g.draw(p, 1); } } },
  '01079': { pt: 'Ação de desafios: ajoelha para uma personagem Greyjoy participante ganhar +1 STR (+2 se fores o primeiro jogador) até ao fim do desafio.', en: 'Challenges action: kneel to give a participating Greyjoy character +1 STR (+2 if you are first player) until the end of the challenge.',
    actions: (g, l, ctx) => { const p = l.owner; if (l.kneel || !g.ch || ctx.reaction) return []; const t = p.chars.filter(c => c.d.f === 'greyjoy' && participating(g, c)); if (!t.length) return []; const n = g.first === p ? 2 : 1;
      return [{ label: LX(`Iron Fleet Scout: +${n} STR`, `Iron Fleet Scout: +${n} STR`), ai: pumpScoreP(g, p, n), run: async () => { const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a personagem', 'Choose the character'), cands: t, min: 1, max: 1, ai: () => 1 }); l.kneel = true; g.pump(c, n); g.log(LX(`${g.cn(c)} ganha +${n} STR.`, `${g.cn(c)} gets +${n} STR.`)); } }]; } },
  '01080': { pt: 'Limited. Ação de marshaling: ajoelha para reduzir em 1 o custo da próxima carta Greyjoy.', en: 'Limited. Marshaling action: kneel so your next Greyjoy card costs 1 less.',
    actions: (g, c) => reducerAct(g, c, 1, x => x.d.f === 'greyjoy', LX('carta Greyjoy', 'Greyjoy card')) },
  '01081': { pt: 'Interrupção: quando uma personagem Greyjoy seria morta, salva-a; o Risen from the Sea fica anexado como Condition Terminal com +1 STR.', en: 'Interrupt: when a Greyjoy character would be killed, save it; Risen from the Sea attaches to it as a Terminal Condition giving +1 STR.',
    attStr: () => 1, terminalWhenAttached: true },
  '01082': { pt: 'Só se fores o primeiro jogador. Ação de desafios: um defensor com STR ≤ 5 não conta para este desafio.', en: 'Only if you are the first player. Challenges action: a defending character with STR 5 or lower does not contribute its STR to this challenge.',
    ev: { timing: 'action', cond: (g, p, ctx) => !!g.ch && g.first === p && !ctx.reaction && g.ch.defenders.some(c => g.str(c) <= 5 && c.flags.noContrib !== g.ch), ai: (g, p) => { const ch = g.ch; if (ch.att !== p) return 0; const best = Math.max(0, ...ch.defenders.filter(c => g.str(c) <= 5).map(c => g.str(c))); return AI.pumpScore(g, p, ch, best); },
      run: async (g, p) => { const ch = g.ch; const t = ch.defenders.filter(c => g.str(c) <= 5); const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX("The Kraken's Grasp: escolhe o defensor", "The Kraken's Grasp: choose the defender"), cands: t, min: 1, max: 1, ai: y => g.str(y) }); c.flags.noContrib = ch; g.log(LX(`${g.cn(c)} não conta para o desafio.`, `${g.cn(c)} does not contribute to the challenge.`)); } } },
  '01083': { pt: 'Reação: depois de ganhares um desafio sem oposição, descarta um anexo ou local do adversário.', en: "Reaction: after you win an unopposed challenge, discard an attachment or location controlled by the losing opponent.",
    ev: { timing: 'afterWin', cond: (g, p, ch) => ch.unopposed && (ch.loser.locs.length || g.attsOf(ch.loser).length), ai: () => 15,
      run: async (g, p, e, ch) => { const t = [...ch.loser.locs, ...g.attsOf(ch.loser)]; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('We Do Not Sow: escolhe o anexo ou local', 'We Do Not Sow: choose the attachment or location'), cands: t, min: 1, max: 1, ai: y => (y.d.cost || 0) + (y.d.m?.income ? 4 : 0) }); await g.discardFromPlay(x); } } },

  // ---------- LANNISTER ----------
  '01102': { pt: 'Só se controlares uma personagem Lannister única. Interrupção: cancela uma habilidade de personagem, local ou anexo do adversário (automatizado para Ações).', en: "Only if you control a unique Lannister character. Interrupt: cancel an opponent's character, location or attachment ability (automated for Actions)." },

  // ---------- MARTELL ----------
  '01103': { pt: 'Ambush (5). Reação: depois de entrar em jogo durante um desafio, retira uma personagem participante do desafio.', en: 'Ambush (5). Reaction: after Areo Hotah enters play during a challenge, remove a participating character from the challenge.',
    onEnter: async (g, c) => { const p = c.owner, ch = g.ch; if (!ch) return; const t = [...ch.attackers, ...ch.defenders].filter(x => x.owner !== p); if (!t.length) return; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Areo Hotah: retira uma personagem do desafio', 'Areo Hotah: remove a character from the challenge'), cands: t, min: 0, max: 1, ai: y => g.str(y) }); if (!x) return; ch.attackers = ch.attackers.filter(y => y !== x); ch.defenders = ch.defenders.filter(y => y !== x); g.log(LX(`${g.cn(x)} sai do desafio.`, `${g.cn(x)} is removed from the challenge.`)); } },
  '01104': { pt: 'Ação: põe em jogo da mão uma personagem com custo impresso ≤ 5; depois a Arianne volta para a mão (1 vez por fase).', en: 'Action: put a character with printed cost 5 or lower into play from your hand, then return Arianne to your hand (once per phase).',
    actions: (g, c, ctx) => { const p = c.owner; if (c.flags.ari === g.phase || ctx.reaction) return []; const t = p.hand.filter(x => x.d.t === 'character' && (x.d.cost || 0) <= 5 && !g.uniqueBlockedByDead(p, x)); if (!t.length) return [];
      return [{ label: LX('Arianne: pôr uma personagem em jogo e voltar à mão', 'Arianne: put a character into play and return to hand'), ai: ctx.beforeChallenge && g.activeP === p && c.kneel && t.some(x => g.str(x) >= 3) ? 6 : 0,
        run: async () => { c.flags.ari = g.phase; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Arianne: escolhe a personagem', 'Arianne: choose the character'), cands: t, min: 1, max: 1, ai: y => g.str(y) + (y.d.cost || 0) }); await g.putIntoPlay(p, x, 'put'); if (c.zone === 'chars') await g.returnToHand(c); } }]; } },
  '01105': { pt: 'Insight. Cada outra personagem Lord ou Lady Martell tua tem +1 STR por cada plot no teu monte de usados.', en: 'Insight. Each other Martell Lord and Lady character you control gets +1 STR for each plot in your used pile.',
    strAura: (g, d, c) => c !== d && c.owner === d.owner && c.d.f === 'martell' && isLordLady(c) ? usedPlots(d.owner) : 0 },
  '01106': { pt: 'Stealth. Ação: paga 1 ouro para o Edric Dayne ganhar um ícone à tua escolha até ao fim da fase.', en: 'Stealth. Action: pay 1 gold to give Edric Dayne a challenge icon of your choice until the end of the phase.',
    actions: (g, c, ctx) => { const p = c.owner; if (p.gold < 1 || ctx.reaction || (c.phIcons || '').length >= 3) return []; const need = ctx.beforeChallenge && g.activeP === p && !c.kneel ? CH_TYPES.find(t => !g.hasIcon(c, t) && AI_NEW.remaining(g, p, t) > 0) : null;
      return [{ label: LX('Edric Dayne: ganhar um ícone (1 ouro)', 'Edric Dayne: gain an icon (1 gold)'), ai: need ? 4 : 0, run: async () => { p.gold -= 1; const t = await chooseIcon(g, p, LX('Que ícone?', 'Which icon?'), v => v === need ? 2 : (g.hasIcon(c, v) ? 0 : 1)); c.phIcons = (c.phIcons || '') + ICON_OF[t]; g.log(LX(`Edric Dayne ganha ${CH_NAMES[t]}.`, `Edric Dayne gains ${CH_NAMES[t]}.`)); } }]; } },
  '01107': { pt: 'Reação: depois de perderes um desafio em que ele participa, uma personagem perde um ícone à tua escolha até ao fim da fase.', en: 'Reaction: after you lose a challenge he took part in, a character loses a challenge icon of your choice until the end of the phase.',
    afterWin: async (g, c, ch) => { const p = c.owner; if (ch.loser !== p || !participating(g, c)) return; const t = p.opp.chars.filter(x => CH_TYPES.some(ty => g.hasIcon(x, ty))); if (!t.length) return;
      const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Maester Caleotte: escolhe a personagem', 'Maester Caleotte: choose the character'), cands: t, min: 0, max: 1, ai: y => g.str(y) }); if (!x) return; const ty = await chooseIcon(g, p, LX('Que ícone perde?', 'Which icon does it lose?'), v => g.hasIcon(x, v) ? (AI_NEW.remaining(g, p.opp, v) > 0 ? 2 : 1) : 0); x.phLost = (x.phLost || '') + ICON_OF[ty]; g.log(LX(`${g.cn(x)} perde ${CH_NAMES[ty]}.`, `${g.cn(x)} loses ${CH_NAMES[ty]}.`)); } },
  '01108': { pt: 'Pode defender em desafios de Poder mesmo ajoelhada.', en: 'May be declared as a defender in Power challenges even while kneeling.', defendKneeling: (g, c, ch) => ch.type === 'power' },
  '01109': { pt: 'Reação: depois de ganhares um desafio em que ele ataca, ganha 1 poder por cada 5 STR de diferença.', en: 'Reaction: after you win a challenge in which he is attacking, he gains 1 power for every 5 STR you won by.',
    afterWin: (g, c, ch) => { if (ch.winner === c.owner && ch.attackers.includes(c)) { const n = Math.floor(ch.diff / 5); if (n > 0) g.gainPower(c.owner, n, c); } } },
  '01110': { pt: 'Ação de marshaling: ajoelha para reduzir em 1 o custo da próxima personagem Martell.', en: 'Marshaling action: kneel so your next Martell character costs 1 less.',
    actions: (g, c) => reducerAct(g, c, 1, x => x.d.t === 'character' && x.d.f === 'martell', LX('personagem Martell', 'Martell character')) },
  '01111': { pt: 'Reação: depois de ser declarado atacante, escolhe uma personagem do defensor; ela tem de defender, se puder.', en: 'Reaction: after it is declared as an attacker, choose a character controlled by the defending player; it must defend if able.',
    afterAttackersDeclared: async (g, c, ch) => { const p = c.owner; if (!ch.attackers.includes(c)) return; const t = ch.def.chars.filter(x => !x.kneel && g.hasIcon(x, ch.type)); if (!t.length) return; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Dornish Paramour: quem tem de defender?', 'Dornish Paramour: who must defend?'), cands: t, min: 0, max: 1, ai: y => -g.str(y) + 5 }); if (x) { (ch.mustDefend = ch.mustDefend || []).push(x); g.log(LX(`${g.cn(x)} terá de defender.`, `${g.cn(x)} must defend.`)); } } },
  '01112': { pt: 'Reação: ao entrar em jogo, vê as 2 cartas do topo; junta até 1 à mão e põe as outras no fundo.', en: 'Reaction: after it enters play, look at the top 2 cards of your deck; add up to 1 to your hand and place the rest on the bottom.',
    onEnter: async (g, c) => { const p = c.owner; const top = p.deck.slice(0, 2); if (!top.length) return; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Greenblood Trader: escolhe até 1 carta para a mão', 'Greenblood Trader: choose up to 1 card for your hand'), cands: top, min: 0, max: 1, ai: y => AI.handValue(g, p, y) + 1, modal: true });
      for (const y of top) { g.removeFromZone(y); if (y === x) { g.toZone(y, 'hand'); g.log(LX(`${p.name} junta uma carta à mão.`, `${p.name} adds a card to hand.`)); } else { y.zone = 'deck'; p.deck.push(y); } } } },
  '01114': { pt: 'Sem anexos. Enquanto não fores o primeiro jogador, ganha ícone de Intriga.', en: 'No attachments. While you are not the first player, gains an Intrigue icon.', icons: (g, c) => g.first !== c.owner ? 'I' : '' },
  '01115': { pt: 'A personagem tem +1 STR por cada plot no teu monte de usados. Se tiver o trait House Dayne, ganha intimidate.', en: 'The attached character gets +1 STR for each plot in your used pile. With the House Dayne trait, it gains intimidate.',
    attStr: (g, a) => usedPlots(a.owner), attKw: (g, a, t) => t.d.tr.includes('House Dayne') ? { intimidate: 1 } : {} },
  '01116': { pt: 'Reação: depois de perderes um desafio como defensor, ajoelha e sacrifica para devolver um atacante à mão do dono.', en: "Reaction: after you lose a challenge as the defending player, kneel and sacrifice it to return an attacking character to its owner's hand.",
    afterWin: async (g, l, ch) => { const p = l.owner; if (l.kneel || ch.loser !== p || ch.def !== p) return; const t = ch.attackers.filter(x => x.zone === 'chars'); if (!t.length) return; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Ghaston Grey: devolver um atacante à mão? (ou nenhum)', 'Ghaston Grey: return an attacker to hand? (or none)'), cands: t, min: 0, max: 1, ai: y => (y.d.cost || 0) >= 4 ? 10 + (y.d.cost || 0) : 0 }); if (!x) return; l.kneel = true; await g.sacrifice(l); await g.returnToHand(x); } },
  '01117': { pt: 'Reação: depois de perderes um desafio como defensor, ajoelha para o claim do teu plot subir 1 em desafios desse tipo até ao fim da fase.', en: 'Reaction: after you lose a challenge as the defending player, kneel to raise the claim on your plot by 1 for challenges of that type until the end of the phase.',
    afterWin: (g, l, ch) => { const p = l.owner; if (l.kneel || ch.loser !== p || ch.def !== p || g.activeP === p || (p.chDone[ch.type] || 0) >= g.maxOfType(p, ch.type)) return; l.kneel = true; p.flags.sunspear = Object.assign({}, p.flags.sunspear, { [ch.type]: g.phase }); g.log(LX(`Sunspear: claim +1 em desafios ${CH_NAMES[ch.type]} nesta fase.`, `Sunspear: claim +1 in ${CH_NAMES[ch.type]} challenges this phase.`)); } },
  '01118': { pt: 'Limited. Ação de marshaling: ajoelha para reduzir em 1 o custo da próxima carta Martell.', en: 'Limited. Marshaling action: kneel so your next Martell card costs 1 less.',
    actions: (g, c) => reducerAct(g, c, 1, x => x.d.f === 'martell', LX('carta Martell', 'Martell card')) },
  '01119': { pt: 'Reação: depois de ganhares um desafio de Intriga por 5 ou mais, ganha X poder (X = plots no teu monte de usados).', en: 'Reaction: after you win an Intrigue challenge by 5 or more, gain X power for your faction (X = plots in your used pile).',
    ev: { timing: 'afterWin', cond: (g, p, ch) => ch.type === 'intrigue' && ch.diff >= 5 && usedPlots(p) > 0, ai: () => 30, run: async (g, p) => g.gainPower(p, usedPlots(p)) } },
  '01120': { pt: 'Só se não fores o primeiro jogador. Reação: depois de perderes um desafio como defensor, escolhe um tipo; o vencedor não pode iniciar desafios desse tipo nesta fase.', en: 'Only if you are not the first player. Reaction: after you lose a challenge as the defending player, name a challenge type; the winner cannot initiate challenges of that type this phase.',
    ev: { timing: 'afterLose', cond: (g, p, ch) => g.first !== p && ch.def === p && CH_TYPES.some(t => g.challengeAllowed(ch.winner, t)), ai: () => 10,
      run: async (g, p, e, ch) => { const w = ch.winner; const t = await chooseIcon(g, p, LX('Unbowed: que tipo fica proibido?', 'Unbowed: which type is banned?'), v => g.challengeAllowed(w, v) ? AI.challengeScore(g, w, v) + 1 : 0); w.flags.banned = Object.assign({}, w.flags.banned, { [t]: g.phase }); g.log(LX(`${w.name} não pode iniciar desafios ${CH_NAMES[t]} nesta fase.`, `${w.name} cannot initiate ${CH_NAMES[t]} challenges this phase.`)); } } },
  '01121': { pt: 'Ação: uma personagem com STR ≤ 4 perde os ícones Militar, Intriga e Poder até ao fim da fase.', en: 'Action: a character with STR 4 or lower loses a Military, an Intrigue and a Power icon until the end of the phase.',
    ev: { timing: 'action', cond: (g, p, ctx) => !ctx.reaction && g.allChars().some(c => g.str(c) <= 4), ai: (g, p, ctx) => { if (ctx.preDefense && g.ch && g.ch.att === p) { const t = p.opp.chars.filter(c => !c.kneel && g.hasIcon(c, g.ch.type) && g.str(c) <= 4); const A = g.sideStr(g.ch, 'att'); const D = p.opp.chars.filter(c => !c.kneel && g.hasIcon(c, g.ch.type)).reduce((s, c) => s + g.str(c), 0); if (t.length && D >= A && D - Math.max(...t.map(c => g.str(c))) < A) return 16; } return 0; },
      run: async (g, p) => { const t = g.allChars().filter(c => g.str(c) <= 4); const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX('Confinement: escolhe a personagem', 'Confinement: choose the character'), cands: t, min: 1, max: 1, ai: y => y.owner === p ? -10 : g.str(y) + (g.ch && !y.kneel && g.hasIcon(y, g.ch.type) ? 5 : 0) }); c.phLost = (c.phLost || '') + 'MIP'; g.log(LX(`${g.cn(c)} perde os ícones até ao fim da fase.`, `${g.cn(c)} loses its icons until the end of the phase.`)); } } },

  // ---------- NIGHT'S WATCH ----------
  '01123': { pt: 'Sem anexos. Stealth. Reação: a personagem contornada por stealth não pode defender em nenhum desafio até ao fim da fase.', en: 'No attachments. Stealth. Reaction: after Ghost bypasses a character using stealth, that character cannot be declared as a defender for the rest of the phase.',
    afterStealth: (g, c, s) => { s.flags.noDefend = g.phase; g.log(LX(`Ghost: ${g.cn(s)} não pode defender nesta fase.`, `Ghost: ${g.cn(s)} cannot defend this phase.`)); } },
  '01124': { pt: "Sem anexos exceto Weapon. Enquanto estiver em pé, participa em cada desafio em que tenhas outra personagem Night's Watch a atacar.", en: "No attachments except Weapon. While standing, he is considered to be participating in each challenge in which you control another attacking Night's Watch character.", attachOnly: 'Weapon',
    autoParticipate: (g, j, ch) => ch.attackers.some(x => x !== j && g.isFaction(x, 'thenightswatch')) },
  '01126': { pt: "Com The Wall, não ajoelha ao defender. Interrupção: no fim da fase de desafios, se não perdeste nenhum desafio a defender, põe em jogo uma carta Night's Watch da mão.", en: "While you control The Wall, does not kneel when declared as a defender. Interrupt: when the challenges phase ends, if you lost no challenge as the defending player, put a Night's Watch card into play from your hand.",
    noKneelDefend: (g, c) => c.owner.locs.some(l => l.code === '01137'),
    onChallengesEnd: async (g, c) => { const p = c.owner; if (p.flags.lostDef === g.phase) return; const t = p.hand.filter(x => x.d.f === 'thenightswatch' && ['character', 'location', 'attachment'].includes(x.d.t) && !g.uniqueBlockedByDead(p, x) && (x.d.t !== 'attachment' || g.attachTargets(p, x).length)); if (!t.length) return;
      const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Old Bear Mormont: pôr em jogo uma carta Night\'s Watch da mão (ou nenhuma)', "Old Bear Mormont: put a Night's Watch card into play from your hand (or none)"), cands: t, min: 0, max: 1, ai: y => (y.d.cost || 0) + 1 }); if (x) await g.putIntoPlay(p, x, 'put'); } },
  '01128': { pt: 'Sem anexos exceto Weapon. Interrupção: quando morre, o adversário descarta 1 carta ao acaso da mão.', en: "No attachments except Weapon. Interrupt: when Ser Waymar Royce is killed, discard 1 card at random from each opponent's hand.", attachOnly: 'Weapon',
    onLeave: async (g, c, how) => { if (how !== 'killed') return; const q = c.owner.opp; if (!q.hand.length) return; const x = q.hand[Math.floor(Math.random() * q.hand.length)]; g.discardFromHand(q, x); g.log(LX(`Ser Waymar Royce: ${q.name} descarta ${g.cn(x)}.`, `Ser Waymar Royce: ${q.name} discards ${g.cn(x)}.`)); } },
  '01131': { pt: 'Sem anexos exceto Weapon. Ação: descarta 1 carta da mão para ganhar 1 ouro (1 vez por fase).', en: 'No attachments except Weapon. Action: discard 1 card from your hand to gain 1 gold (once per phase).', attachOnly: 'Weapon',
    actions: (g, c, ctx) => { const p = c.owner; if (c.flags.ofh === g.phase || !p.hand.length || ctx.reaction) return []; const need = g.phase === 'marshal' && g.activeP === p && p.hand.some(x => x.d.t !== 'event' && g.costOf(p, x, 'marshal') === p.gold + 1) && p.hand.length >= 3;
      return [{ label: LX('Old Forest Hunter: descartar 1 carta para ganhar 1 ouro', 'Old Forest Hunter: discard 1 card to gain 1 gold'), ai: need ? 50 : 0, run: async () => { c.flags.ofh = g.phase; const [x] = await p.ctrl.chooseCards(g, p, { prompt: LX('Escolhe a carta a descartar', 'Choose the card to discard'), cands: [...p.hand], min: 1, max: 1, ai: y => (y.code === '10035' ? 50 : 0) - AI.handValue(g, p, y) }); g.discardFromHand(p, x); p.gold += 1; g.log(LX(`${p.name} descarta ${g.cn(x)} e ganha 1 ouro.`, `${p.name} discards ${g.cn(x)} and gains 1 gold.`), 'gold'); } }]; } },
  '01138': { pt: 'Reação: depois de o adversário recolher rendimento, move 1 ouro do gold pool dele para o teu (máx. 1 por ronda).', en: "Reaction: after an opponent collects income, move 1 gold from their gold pool to yours (max 1 per round)." },
  '01140': { pt: "Só num desafio com uma personagem Night's Watch tua a participar. Reação: depois de ganhares por 5 ou mais como defensor, o adversário não pode iniciar mais desafios contra ti nesta ronda.", en: "Only during a challenge with a participating Night's Watch character you control. Reaction: after you win by 5 or more as the defending player, the loser cannot initiate challenges against you this round.",
    ev: { timing: 'afterWin', cond: (g, p, ch) => ch.def === p && ch.diff >= 5 && ch.defenders.some(c => g.isFaction(c, 'thenightswatch')) && CH_TYPES.some(t => g.challengeAllowed(ch.att, t)), ai: () => 20,
      run: async (g, p, e, ch) => { ch.att.flags.noChallengeRound = true; g.log(LX(`${ch.att.name} não pode iniciar mais desafios nesta ronda.`, `${ch.att.name} cannot initiate more challenges this round.`)); } } },

  // ---------- TARGARYEN ----------
  '01172': { pt: 'Só Dothraki. +2 STR. No Khal Drogo, ele não ajoelha ao atacar no primeiro desafio Militar que iniciares em cada ronda.', en: 'Dothraki character only. +2 STR. On Khal Drogo, he does not kneel when attacking in the first Military challenge you initiate each round.',
    attachOk: (g, a, t) => t.d.tr.includes('Dothraki'), attStr: () => 2 },

  on: store.get('agot_img', true), fails: 0, oks: 0, broken: new Set(), good: new Map(),
  urls(code) {

  if (a) h += `<div class="pv-txt">${esc(a)}</div>`;
  else if (d.v) h += `<div class="pv-txt">${kws.length ? LX('Só keywords/modificadores — totalmente automatizada.', 'Keywords/modifiers only — fully automated.') : LX('Sem texto de habilidade.', 'No ability text.')}</div>`;
  else h += `<div class="pv-txt pv-warn">${LX('⚠ Habilidade ainda não automatizada: a carta joga apenas com custo, STR, ícones e keywords.', '⚠ Ability not automated yet: the card plays with cost, STR, icons and keywords only.')}</div>`;
  if (inst) {
    if (inst.att && inst.att.length) h += `<div class="pv-row">${LX('Anexos', 'Attachments')}: ${inst.att.map(x => esc(x.d.n)).join(', ')}</div>`;
    if (inst.kneel) h += `<div class="pv-row" style="color:var(--dim)">${LX('Ajoelhada', 'Knelt')}</div>`;
    if (inst.flags && inst.flags.poison) h += `<div class="pv-row" style="color:#9f9">☠ ${LX('Envenenada', 'Poisoned')}</div>`;
  }
  h += `<div class="pv-row"><a href="https://thronesdb.com/card/${d.c}" target="_blank" rel="noopener" class="note">ThronesDB ↗</a></div>`;
  return h;
}

class HumanCtrl {
  constructor() { this.isAI = false; }
  chooseCards(g, p, o) {
    if (!o.cands.length) return Promise.resolve([]);
    if (!o.force && o.cands.length <= o.min) return Promise.resolve([...o.cands]);
    return new Promise(res => UI.setPending({ kind: 'select', ...o, sel: [], resolve: res }));
  }
  chooseOption(g, p, o) { return new Promise(res => UI.setPending({ kind: 'option', ...o, resolve: res })); }
  actionWindow(g, p, o) { return new Promise(res => UI.setPending({ kind: 'action', ...o, resolve: res })); }
  inform(g, p, o) {
    if (!UI.pauseInfo) { UI.toast(o.title + ' — ' + o.lines.slice(-3).map(l => l.msg).join(' · '), o.tone); return Promise.resolve(); }
    return new Promise(res => UI.setPending({ kind: 'info', ...o, resolve: res }));
  }
}
