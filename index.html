<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westeros LCG — Simulador AGoT 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0d0e12;--panel:#17191f;--panel2:#1f222a;--line:#2e323c;--gold:#d9a642;--gold2:#f0c96a;--txt:#e6e1d6;--dim:#8d8a83;--red:#c0392b;--green:#3f9d5a;--blue:#3c6fb0;
--f-stark:#c9ccd1;--f-lannister:#a8231d;--f-baratheon:#d8b21f;--f-greyjoy:#1f4f6b;--f-martell:#d97a1e;--f-thenightswatch:#3a3a3a;--f-targaryen:#6e1414;--f-tyrell:#2f6b2a;--f-neutral:#8a7a5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#1b1d26 0%,var(--bg) 60%);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:6px 12px;border-radius:6px}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(#c8952f,#9c6f1c);color:#1a1205;border-color:#e0b552;font-weight:600}
button.pri:hover:not(:disabled){color:#000;filter:brightness(1.1)}
button.warn{border-color:#7a2a24}
input,select,textarea{font:inherit;background:#0f1116;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
header{display:flex;align-items:center;gap:18px;padding:8px 16px;background:#08090c;border-bottom:1px solid #2a2418}
header h1{font-family:'Cinzel',serif;font-size:20px;margin:0;letter-spacing:2px;color:var(--gold2);font-weight:600}
header nav{display:flex;gap:4px}
header nav button{background:none;border:none;color:var(--gold);font-family:'Cinzel',serif;font-size:15px;padding:6px 10px}
header nav button.on{color:#fff;border-bottom:2px solid var(--gold)}
.screen{display:none;height:calc(100vh - 47px)}
.screen.on{display:flex}
/* ---------- cartas ---------- */
.card{position:relative;width:90px;height:132px;border-radius:7px;background:#e9dfc6;color:#1d1a14;border:2px solid #222;box-shadow:0 2px 6px #0009;overflow:hidden;user-select:none;flex:none;transition:transform .15s}
.card .hd{height:27px;background:var(--fc);color:#fff;font-size:9px;line-height:1.1;font-weight:700;padding:2px 3px 0 22px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 1px #000}
.card.fac-stark .hd{color:#111;text-shadow:none}
.card .cost{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#ffd877,#b8861e);color:#2a1c00;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid #5a3d00}
.card .body{padding:3px 4px;font-size:9px;line-height:1.15}
.card .ty{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:#6b5f48}
.card .tr{font-style:italic;font-size:8.5px;color:#4a4232;margin-top:1px}
.card .icons{position:absolute;left:3px;top:52px;display:flex;flex-direction:column;gap:2px}
.ic{display:inline-flex;width:15px;height:15px;border-radius:3px;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
.ic.M{background:#b3261e}.ic.I{background:#2b8a3e}.ic.P{background:#c99a17}
.card .str{position:absolute;left:2px;bottom:2px;width:22px;height:22px;border-radius:4px;background:#3b3b3b;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid #000}
.card .str.up{background:#2f7d43}.card .str.down{background:#8a2a20}
.card .kw{position:absolute;left:26px;right:3px;bottom:3px;font-size:8px;font-weight:700;color:#3a2f1d;line-height:1.1}
.card .mid{position:absolute;left:4px;right:3px;top:50px;font-size:8.5px;color:#3b3427;line-height:1.15}
.card .warn{position:absolute;right:2px;top:29px;font-size:10px}
.card .badges{position:absolute;right:2px;bottom:2px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tok{border-radius:10px;padding:0 5px;font-size:10px;font-weight:800;color:#fff;border:1px solid #000;line-height:15px}
.tok.pow{background:#7b3fb0}.tok.dup{background:#555}.tok.gold{background:#b8861e}
.card.back{background:repeating-linear-gradient(45deg,#3a2414,#3a2414 6px,#2c1a0e 6px,#2c1a0e 12px);border-color:#6d4a22}
.card.plotc{width:126px;height:88px}
.card.plotc .pst{position:absolute;bottom:3px;left:4px;right:4px;display:flex;justify-content:space-between;font-size:9px;font-weight:700}
.slot{position:relative;width:94px;height:138px;display:flex;align-items:flex-start;justify-content:center;flex:none}
.slot.kneel{width:138px}
.slot.kneel>.card{transform:rotate(90deg) translate(22px,0)}
.slot .atts{position:absolute;left:0;right:0;bottom:-6px;display:flex;flex-direction:column;gap:1px;z-index:2}
.slot.kneel .atts{left:18px;right:18px}
.attc{background:#cfc2a0;color:#1d1a14;border:1px solid #333;border-radius:3px;font-size:9px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.attc.kn{opacity:.6;font-style:italic}
.cand{outline:3px solid #46d06a;outline-offset:1px;cursor:pointer;box-shadow:0 0 12px #46d06a}
.sel{outline:3px solid #f0c96a!important;box-shadow:0 0 14px #f0c96a!important}
.act{outline:2px dashed #46d06a;outline-offset:1px;cursor:pointer}
.card.atk::after,.card.def::after{position:absolute;top:44px;right:2px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;color:#fff}
.card.atk::after{content:'ATQ';background:#b3261e}.card.def::after{content:'DEF';background:#2f5d9c}
.card.blank{filter:grayscale(.7)}
/* ---------- tabuleiro ---------- */
#game{gap:0}
#gside{width:230px;display:flex;flex-direction:column;gap:8px;padding:8px;border-right:1px solid var(--line);background:#0b0c10cc;overflow:auto}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.pp.me{border-color:#5a4a26}
.pp .nm{font-family:'Cinzel',serif;font-size:15px;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.stat{background:#0f1116;border:1px solid var(--line);border-radius:14px;padding:2px 8px;font-weight:700}
.stat.p{color:#c99cf0}.stat.g{color:#f0c96a}
.piles{display:flex;gap:4px;flex-wrap:wrap}
.piles button{padding:2px 6px;font-size:11px}
.fbadge{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;background:var(--fc);text-shadow:0 1px 2px #000}
.fbadge.kn{opacity:.5;text-decoration:line-through}
.phasebox{background:#2b1d4a;border:1px solid #5a3f93;border-radius:8px;padding:8px;text-align:center}
.phasebox b{display:block;font-family:'Cinzel',serif;font-size:15px;letter-spacing:1px}
.mini-plot{margin-top:6px}
#gcenter{flex:1;display:flex;flex-direction:column;min-width:0}
#board{flex:1;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:6px;min-height:142px;align-items:flex-start;flex-wrap:wrap;padding:2px;border-radius:8px}
.row.locs{min-height:142px;background:#ffffff05}
.row .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.divider{display:flex;align-items:center;gap:10px;min-height:34px;margin:2px 0}
.divider .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#5a4a26,transparent)}
.chb{background:#2a1414;border:1px solid #7a2a24;border-radius:20px;padding:5px 14px;font-weight:700}
.chb .a{color:#ff8b7e}.chb .d{color:#8fb4ff}
#prompt{background:#141720;border-top:1px solid #3b3220;border-bottom:1px solid #3b3220;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px}
#prompt .txt{flex:1;min-width:200px;font-weight:600;color:var(--gold2)}
#prompt .txt.wait{color:var(--dim);font-weight:400}
#hand{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;min-height:150px;background:#0a0b0e}
#oppHand{display:flex;gap:3px;padding:2px 0}
#oppHand .card{width:28px;height:40px;border-width:1px}
#gright{width:290px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#0b0c10cc}
#preview{height:330px;padding:10px;border-bottom:1px solid var(--line);overflow:auto}
.pvbox .pv-name{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2)}
.pvbox .pv-meta{color:var(--dim);margin:4px 0}
.pvbox .pv-row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pvbox .pv-txt{background:#0f1116;border:1px solid var(--line);border-radius:6px;padding:8px;line-height:1.45;margin-top:6px}
.pvbox .pv-warn{color:#f0a35a}
#log{flex:1;overflow:auto;padding:8px 10px;font-size:12px;line-height:1.45}
#log div{border-bottom:1px solid #ffffff08;padding:1px 0}
#log .phase{color:var(--gold2);font-family:'Cinzel',serif;margin-top:6px}
#log .ch{color:#ffb4a8}#log .chw{color:#ffd36a;font-weight:600}#log .kill{color:#ff7a6a}#log .pow{color:#c99cf0}#log .gold{color:#e8c46a}#log .dim{color:var(--dim)}#log .win{color:#7dff9a;font-weight:700;font-size:14px}#log .ev{color:#9fd3ff}
.menu{position:fixed;z-index:50;background:#1b1e26;border:1px solid var(--gold);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 20px #000}
.menu button{text-align:left}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:40}
.modal .box{background:var(--panel);border:1px solid #5a4a26;border-radius:10px;max-width:min(980px,94vw);max-height:88vh;overflow:auto;padding:14px 16px}
.modal h3{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold2)}
.cgrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.overlay-win{font-family:'Cinzel',serif;font-size:26px;color:var(--gold2);text-align:center;margin:6px 0 12px}
/* ---------- ecrãs de menu ---------- */
.wrap{flex:1;overflow:auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold2);font-size:18px}
.lobby{max-width:760px;margin:0 auto}
.lobby label{display:block;color:var(--dim);margin:10px 0 4px}
.lobby select{width:100%}
.note{color:var(--dim);font-size:12px;line-height:1.5}
/* ---------- deckbuilder ---------- */
#decks{gap:0}
#dlist{width:220px;border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#dlist .di{padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
#dlist .di:hover{background:var(--panel2)}
#dlist .di.on{border-color:var(--gold);background:#2a2316}
#dlist .di small{display:block;color:var(--dim)}
#pool{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button.on{border-color:var(--gold);color:var(--gold2);background:#2a2316}
.tbl{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#1d2029;text-align:left;font-weight:600;color:var(--dim);padding:6px;font-size:12px;z-index:1}
td{padding:4px 6px;border-top:1px solid #ffffff0a}
tr:hover td{background:#ffffff06}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.qty button{border:none;border-radius:0;padding:2px 8px;background:#0f1116}
.qty button.on{background:var(--blue);color:#fff}
#dside{width:330px;border-left:1px solid var(--line);padding:10px;overflow:auto}
#dside .grp{margin-top:8px}
#dside .grp h4{margin:6px 0 2px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px}
#dside .ln{display:flex;justify-content:space-between;padding:1px 0;cursor:default}
.valid{padding:6px 8px;border-radius:6px;margin:8px 0;font-weight:600}
.valid.ok{background:#1d3b25;color:#8fe0a5}.valid.bad{background:#3b1d1d;color:#ff9c90}
.fdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fc);vertical-align:middle;margin-right:4px;border:1px solid #000}
.help{max-width:900px;margin:0 auto;line-height:1.55}
.help code{background:#0f1116;padding:1px 4px;border-radius:4px}
.autolist{columns:2;font-size:12px}
@media (max-width:1100px){#gright{width:230px}#preview{height:260px}}

.fbadge.f-stark{color:#111;text-shadow:none}
/* ---------- imagens ---------- */
.card .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:5px;z-index:1;opacity:0}
.card.hasimg .cimg{opacity:1}
.card.plotc .cimg{object-fit:cover}
.card .ov{position:absolute;left:2px;bottom:2px;z-index:3;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none}
.card:not(.hasimg) .ov{display:none}
.ovstr{min-width:22px;height:22px;border-radius:4px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid #000;box-shadow:0 0 4px #000}
.ovstr.up{background:#2f7d43}.ovstr.down{background:#8a2a20}
.ovic{display:flex;gap:1px}
.card .badges,.card .warn,.card.atk::after,.card.def::after{z-index:3}
.card.blank.hasimg .cimg{filter:grayscale(.8)}
.pvimg{display:none;width:100%;max-width:230px;margin:0 auto 8px;border-radius:10px;box-shadow:0 4px 14px #000}
.pvimg.plot{max-width:270px}
.pvimg.ok{display:block}
#preview{height:auto;max-height:58vh}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.card.big{width:120px;height:170px}
.card.big .hd{font-size:10.5px}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;max-width:420px;background:#2a2316;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;box-shadow:0 6px 20px #000;cursor:pointer;line-height:1.4}
#langBtn,#imgBtn{padding:4px 10px;font-size:12px}

/* ---------- v0.5 ---------- */
.ic{font-size:10px;font-weight:400;line-height:1}
.ic.P{background:#2c5aa0}
.modal.sel-modal{right:290px}
@media (max-width:1100px){.modal.sel-modal{right:230px}}
#gright.nolog #log{display:none}
#gright.nolog #preview{max-height:none;flex:1}
#logToggle{margin:4px 8px;padding:3px 8px;font-size:11px;align-self:flex-start}
#gcenter{position:relative}
.infobox{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:min(560px,92%);max-height:60%;overflow:auto;z-index:30;background:#15171ef2;border:2px solid var(--gold);border-radius:12px;padding:14px 18px;box-shadow:0 10px 40px #000c}
.infobox.good{border-color:#46d06a}.infobox.bad{border-color:#e0574a}
.infobox h3{margin:0 0 8px;font-family:'Cinzel',serif;color:var(--gold2);font-size:17px}
.infobox.good h3{color:#7dff9a}.infobox.bad h3{color:#ff8b7e}
.infobox .ilines{font-size:13px;line-height:1.5;margin-bottom:10px}
.infobox .ilines .kill{color:#ff7a6a}.infobox .ilines .pow{color:#c99cf0}.infobox .ilines .gold{color:#e8c46a}.infobox .ilines .ch{color:#ffb4a8}.infobox .ilines .chw{color:#ffd36a;font-weight:600}.infobox .ilines .ev{color:#9fd3ff}
.stat.up{color:#7dff9a;border-color:#2f7d43}.stat.down{color:#ff8b7e}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#toasts .toast{position:static}
.toast.good{border-color:#46d06a}.toast.bad{border-color:#e0574a}
.kwlist{max-width:640px;columns:1}
.kwlist b{color:var(--gold2)}.kwlist p{margin:2px 0 10px;line-height:1.45}
#pauseBtn,#kwBtn{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<header><h1>WESTEROS LCG</h1><nav><button data-t="play"></button><button data-t="decks"></button><button data-t="help"></button></nav><span class="note" id="tagline" style="margin-left:auto"></span><button id="kwBtn"></button><button id="pauseBtn"></button><button id="imgBtn"></button><button id="langBtn"></button></header>
<section id="lobby" class="screen"></section>
<section id="game" class="screen">
  <aside id="gside"></aside>
  <main id="gcenter"><div id="board"></div><div id="prompt"></div><div id="hand"></div><div style="display:none" id="oppHand"></div></main>
  <aside id="gright"><div id="preview" class="pvbox"></div><button id="logToggle"></button><div id="log"></div></aside>
</section>
<section id="decks" class="screen"><aside id="dlist"></aside><main id="pool"></main><aside id="dside"><div class="pvbox panel" style="min-height:120px;padding:10px"></div><div id="dsideIn"></div></aside></section>

    if (!attackers.length) return;

    this.log(LX(`${att.name} inicia um desafio ${CH_NAMES[type]} com ${attackers.map(c => this.cn(c)).join(', ')}.`, `${att.name} initiates a challenge (${CH_NAMES[type]}) with ${attackers.map(c => this.cn(c)).join(', ')}.`), 'ch');
    this.emit();
    await this.fire('afterChallengeInitiated', ch);
    // stealth
    for (const c of ch.attackers) if (this.hasKw(c, 'stealth')) {
      const t = def.chars.filter(x => !this.hasKw(x, 'stealth') && !ch.stealthed.includes(x));
      if (!t.length) continue;
      const [s] = await att.ctrl.chooseCards(this, att, { prompt: LX(`Stealth de ${this.cn(c)}: escolhe uma personagem que não pode defender`, `${this.cn(c)}'s stealth: choose a character that cannot defend`), cands: t, min: 0, max: 1, ai: x => AI.stealthScore(this, att, x, type) });
      if (s) { ch.stealthed.push(s); this.log(LX(`${this.cn(c)} usa stealth em ${this.cn(s)}.`, `${this.cn(c)} uses stealth on ${this.cn(s)}.`)); }
    }
    // janela de ações depois de iniciar o desafio (regras: antes dos defensores)
    await this.actionRound({ phase: 'challenges', ch, active: att, preDefense: true }, this.first, LX(`Desafio ${CH_NAMES[type]} iniciado (ataque ${this.sumStr(ch.attackers)}). Ações antes dos defensores?`, `${CH_NAMES[type]} challenge initiated (attack ${this.sumStr(ch.attackers)}). Actions before defenders?`));
    // defensores
    const dc = def.chars.filter(c => !c.kneel && this.hasIcon(c, type) && !ch.stealthed.includes(c));
    if (dc.length) {
      const defenders = await def.ctrl.chooseCards(this, def, { prompt: LX(`${att.name} ataca (${CH_NAMES[type]}, STR ${this.sumStr(ch.attackers)}). Escolhe os defensores (ou nenhum).`, `${att.name} attacks (${CH_NAMES[type]}, STR ${this.sumStr(ch.attackers)}). Choose defenders (or none).`), cands: dc, min: 0, max: jousting ? 1 : dc.length, aiPick: () => AI.pickDefenders(this, def, ch, dc, jousting), doneLabel: LX('Confirmar defesa', 'Confirm defense') });
      ch.defenders = [...defenders];
      for (const c of defenders) c.kneel = true;
      if (defenders.length) this.log(LX(`${def.name} defende com ${defenders.map(c => this.cn(c)).join(', ')}.`, `${def.name} defends with ${defenders.map(c => this.cn(c)).join(', ')}.`), 'ch'); else this.log(LX(`${def.name} não defende.`, `${def.name} does not defend.`), 'ch');
    } else this.log(LX(`${def.name} não tem defensores disponíveis.`, `${def.name} has no available defenders.`), 'ch');
    this.emit();
    // janela de ações
    await this.actionRound({ phase: 'challenges', ch, active: att }, this.first, LX(`Desafio ${CH_NAMES[type]} — Ataque ${this.sumStr(ch.attackers)} × Defesa ${this.sumStr(ch.defenders)}. Ações?`, `${CH_NAMES[type]} challenge — Attack ${this.sumStr(ch.attackers)} × Defense ${this.sumStr(ch.defenders)}. Actions?`));
    // resultado
    const A = this.sumStr(ch.attackers), D = this.sumStr(ch.defenders);
    if (A >= D && A > 0 && ch.attackers.length) { ch.winner = att; ch.loser = def; }

    ch.diff = Math.abs(A - D);
    if (!ch.winner) { this.log(LX(`Desafio ${CH_NAMES[type]}: sem vencedor (${A} × ${D}).`, `${CH_NAMES[type]} challenge: no winner (${A} × ${D}).`), 'ch'); this.cleanupChallenge(); await this.informChallenge(ch, mc, A, D); return; }
    this.log(LX(`Desafio ${CH_NAMES[type]}: ${ch.winner.name} vence (${A} × ${D}).`, `${CH_NAMES[type]} challenge: ${ch.winner.name} wins (${A} × ${D}).`), 'chw');
    ch.winner.won[type] = (ch.winner.won[type] || 0) + 1;
    if (ch.winner === att) {
      if (D === 0) { this.log(LX('Desafio sem oposição (unopposed): +1 poder.', 'Unopposed challenge: +1 power.')); this.gainPower(att, 1); }

    }

    await this.fire('afterWin', ch);

    await this.offerEvents(ch.winner, 'afterWin', ch);
    await this.offerEvents(ch.loser, 'afterLose', ch);
    this.cleanupChallenge();
    this.checkWin();
    await this.informChallenge(ch, mc, A, D);
  }
  async informChallenge(ch, mc, A, D) {
    for (const p of this.players) {
      if (!p.ctrl.inform) continue;
      const nm = CH_NAMES[ch.type];
      let title, tone;
      if (!ch.winner) { title = LX(`Desafio ${nm}: sem vencedor (${A} × ${D})`, `${nm} challenge: no winner (${A} × ${D})`); tone = ''; }
      else if (ch.winner === p) { title = LX(`Ganhaste o desafio ${nm} (${A} × ${D})`, `You won the ${nm} challenge (${A} × ${D})`); tone = 'good'; }
      else { title = LX(`Perdeste o desafio ${nm} (${A} × ${D})`, `You lost the ${nm} challenge (${A} × ${D})`); tone = 'bad'; }
      const lines = this.logs.filter(l => l.id >= mc && l.cls !== 'phase' && l.cls !== 'dim');
      await p.ctrl.inform(this, p, { title, lines, tone });

  }
  sumStr(list) { return list.filter(c => c.zone === 'chars').reduce((s, c) => s + this.str(c), 0); }
  claimValue(ch) {
    let v = ch.att.plot ? ch.att.plot.d.p[2] : 1;
    v += ch.claimMod;
    for (const c of ch.attackers) if (!this.blank(c) && ab(c).claimMod) v += ab(c).claimMod(this, c, ch);
    if (this.myPlot(ch.def, '01008') && ch.def.plot.flags.calmType === ch.type) v -= 1;
    return Math.max(0, v);
  }
  async applyClaim(ch) {
    const n = this.claimValue(ch), L = ch.loser, W = ch.winner;
    if (n <= 0) return;
    this.log(`Claim ${n} (${CH_NAMES[ch.type]}).`);
    if (ch.type === 'military') {
      for (let i = 0; i < n; i++) {
        const cands = L.chars.filter(c => !(ch.killedByClaim || []).includes(c));
        if (!cands.length) break;
        const [v] = await L.ctrl.chooseCards(this, L, { prompt: LX(`Claim militar: escolhe uma personagem tua para morrer (${i + 1}/${n})`, `Military claim: choose one of your characters to kill (${i + 1}/${n})`), cands, min: 1, max: 1, ai: x => -AI.value(this, x) + (x.dupes.length ? 20 : 0) });
        (ch.killedByClaim = ch.killedByClaim || []).push(v);
        await this.kill(v);
      }
    } else if (ch.type === 'intrigue') {
      for (let i = 0; i < n && L.hand.length; i++) { const c = L.hand[Math.floor(Math.random() * L.hand.length)]; this.discardFromHand(L, c); this.log(LX(`${L.name} descarta ao acaso: ${this.cn(c)}.`, `${L.name} discards at random: ${this.cn(c)}.`)); }
    } else {
      this.movePower(L, W, n);
    }
    this.emit();
  }
  async keywords(ch) {
    const W = ch.winner, L = ch.loser;
    const parts = (W === ch.att ? ch.attackers : ch.defenders).filter(c => c.zone === 'chars');
    let intimDone = false;
    for (const c of parts) {
      if (this.hasKw(c, 'insight')) { this.log(`Insight (${this.cn(c)}):`); this.draw(W, 1); }
      if (this.hasKw(c, 'intimidate') && !intimDone && W === ch.att) {
        const t = L.chars.filter(x => !x.kneel && this.str(x) <= ch.diff);
        if (t.length) {
          const [k] = await W.ctrl.chooseCards(this, W, { prompt: LX(`Intimidate (${this.cn(c)}): ajoelha uma personagem com STR ≤ ${ch.diff}`, `Intimidate (${this.cn(c)}): kneel a character with STR ≤ ${ch.diff}`), cands: t, min: 0, max: 1, ai: x => AI.value(this, x) });
          if (k) { k.kneel = true; intimDone = true; this.log(LX(`${this.cn(c)} intimida ${this.cn(k)} (ajoelhada).`, `${this.cn(c)} intimidates ${this.cn(k)} (knelt).`)); }
        }
      }
      if (this.hasKw(c, 'pillage')) { this.log(`Pillage (${this.cn(c)}):`); this.discardTop(L); }
      if (this.hasKw(c, 'renown')) this.gainPower(W, 1, c);
    }
  }
  async offerEvents(p, timing, ch) {
    if (!p) return;
    let guard = 0;
    while (guard++ < 5) {
      const evs = p.hand.filter(c => this.canPlayEvent(p, c, timing, ch) && !(ch.usedEvents || []).includes(c.code));
      if (!evs.length) return;
      const acts = evs.map(c => ({ card: c, label: LX(`Jogar ${this.cn(c)}`, `Play ${this.cn(c)}`), ai: ab(c).ev.ai ? ab(c).ev.ai(this, p, ch) : 1, run: async () => { (ch.usedEvents = ch.usedEvents || []).push(c.code); await this.playEvent(p, c, ch); } }));
      const a = await p.ctrl.actionWindow(this, p, { prompt: timing === 'afterWin' ? LX('Ganhaste o desafio — reação?', 'You won the challenge — reaction?') : LX('Perdeste o desafio — reação?', 'You lost the challenge — reaction?'), actions: acts, passLabel: LX('Não', 'No'), ctx: { phase: 'challenges', ch, reaction: true } });
      if (!a) return;

  cleanupChallenge() {

  // ---------- dominance ----------
  domStr(p) {

  async dominancePhase() {
    const m0 = this.mark();
    this.phase = 'dominance'; this.log('— Dominance —', 'phase');
    await this.actionRound({ phase: 'dominance' }, this.first, LX('Dominance: ações antes de calcular?', 'Dominance: actions before it is determined?'));
    const [a, b] = this.players; const da = this.domStr(a), db = this.domStr(b);
    this.log(`Dominance: ${a.name} ${da} × ${b.name} ${db}.`);
    if (da !== db) {
      const w = da > db ? a : b; this.log(LX(`${w.name} ganha dominance.`, `${w.name} wins dominance.`), 'chw'); this.gainPower(w, 1);
      if (this.myPlot(w, '01002')) { this.log('A Feast for Crows:'); this.gainPower(w, 2); }

  async standingPhase() {
    this.mEnd = this.mark();
    this.phase = 'standing'; this.log('— Standing —', 'phase');

    for (const c of stood) if (c.zone === 'chars' && !this.blank(c) && ab(c).afterStand && this.canTrigger(c.owner)) await ab(c).afterStand(this, c);
    await this.endPhase();

  async taxationPhase() {
    this.phase = 'taxation'; this.log('— Taxation —', 'phase');
    for (const p of this.players) p.gold = 0;
    for (const p of this.order()) {
      const r = this.reserve(p); const over = p.hand.length - r;
      if (over > 0) {
        const cs = await p.ctrl.chooseCards(this, p, { prompt: LX(`Reserve ${r}: descarta ${over} carta${over > 1 ? 's' : ''} da mão`, `Reserve ${r}: discard ${over} card${over > 1 ? 's' : ''} from your hand`), cands: [...p.hand], min: over, max: over, ai: x => -AI.handValue(this, p, x) });
        for (const c of cs) this.discardFromHand(p, c);

      }
    }
    await this.inform(LX('Fim da ronda', 'End of round'), this.mEnd);
    await this.endPhase();
  }
}

function reducerAct(g, c, amt, filter, desc, opts = {}) {
  const p = c.owner;
  if (c.kneel || g.phase !== 'marshal' || g.activeP !== p) return [];
  return [{
    label: LX(`${opts.sac ? 'Ajoelhar e sacrificar' : 'Ajoelhar'}: −${amt} no próximo ${desc}`, `${opts.sac ? 'Kneel and sacrifice' : 'Kneel'}: −${amt} to your next ${desc}`),
    ai: AI.reducerScore(g, p, filter, amt, opts.sac),
    run: async () => {
      c.kneel = true; p.reducers.push({ amt, f: filter, modes: opts.modes || ['marshal'] });
      g.log(LX(`${p.name} ajoelha ${g.cn(c)} (−${amt} no próximo ${desc}).`, `${p.name} kneels ${g.cn(c)} (−${amt} to the next ${desc}).`));
      if (opts.sac) await g.sacrifice(c);
    }
  }];
}
async function searchTop(g, p, n, filter, what) {
  const top = p.deck.slice(0, n).filter(filter);
  if (top.length) {
    const [c] = await p.ctrl.chooseCards(g, p, { prompt: LX(`Procura ${what} nas ${n} cartas do topo`, `Search the top ${n} cards for ${what}`), cands: top, min: 0, max: 1, ai: x => AI.handValue(g, p, x) + 1, modal: true });
    if (c) { g.removeFromZone(c); g.toZone(c, 'hand'); g.log(LX(`${p.name} revela ${g.cn(c)} e junta-a à mão.`, `${p.name} reveals ${g.cn(c)} and adds it to their hand.`)); }
  } else g.log(LX(`${p.name} não encontrou ${what}.`, `${p.name} did not find ${what}.`));
  shuffle(p.deck);
}

const AI_BASE = {
  firstPlayerScore(g, w, choice) { return choice === w ? 1 : 0; },
  wantsMulligan(g, p) {
    const chars = p.hand.filter(c => c.d.t === 'character' && (c.d.cost || 0) <= 8);
    const cheap = chars.filter(c => (c.d.cost || 0) <= 4);
    return chars.length < 2 || (chars.length < 3 && !cheap.length);
  },
  value(g, c) { return (c.d.cost || 0) + (c.d.t === 'character' ? g.str(c) : 0) + 2 * c.power + (c.d.u ? 2 : 0) + c.att.length * 1.5 + c.dupes.length * 2; },
  iconsCount(g, c) { return CH_TYPES.filter(t => g.hasIcon(c, t)).length; },
  handValue(g, p, c) { if (c.d.t === 'event') return 3 + (c.d.cost === 'X' ? 2 : 0); return (c.d.cost || 0) + (c.d.s || 0) + (c.d.u && g.findDupeTarget(p, c) ? 4 : 0); },
  defPotential(g, p, type, exclude = []) { // força máxima que p pode defender
    return p.chars.filter(c => !c.kneel && g.hasIcon(c, type) && !exclude.includes(c)).reduce((s, c) => s + g.str(c), 0);
  },
  attPotential(g, p, type) { return p.chars.filter(c => g.canAttackWith(p, c, type)).reduce((s, c) => s + g.str(c), 0); },
  setupScore(g, p, c, budget) {
    if (g.findDupeTarget(p, c)) return 6;
    if (c.d.t === 'character') return 10 + g.str(c) + (c.d.cost || 0) + AI.iconsCount(g, c) - (c.d.k?.ambush ? 3 : 0);
    if (c.d.t === 'location') return (c.d.m?.income ? 12 : 4) + (c.d.cost || 0);
    if (c.d.t === 'attachment') return c.code === '01035' ? (p.opp.chars.length ? 3 : -1) : (p.chars.some(t => AI.attachScore(g, p, c, t) > 0) ? 3 : -1);
    return -1;
  },
  attachScore(g, p, a, t) {
    if (a.code === '01035') return t.owner !== p ? AI.value(g, t) + (DB[t.code].v ? -5 : 3) : -50;
    if (t.owner !== p) return -50;
    let s = AI.value(g, t);
    const gives = { '01034': 'intrigue', '01036': 'power', '01037': 'military' }[a.code];
    if (gives) s += g.hasIcon(t, gives) ? -6 : 6;
    if (a.code === '01032' || a.code === '01096' || a.code === '01153') s += g.str(t);
    return s;
  },
  marshalScore(g, p, c) {
    if (g.findDupeTarget(p, c)) return 9;
    if (c.d.t === 'character') {
      if (c.code === '01095') return 2; // melhor por ambush
      return 10 + g.str(c) + AI.iconsCount(g, c) * 2 + (c.d.cost || 0) + (c.d.m?.income ? 6 : 0);
    }
    if (c.d.t === 'location') { if (c.d.m?.income) return 40; if (c.code === '01038') return 12; if (c.code === '01039') return 25; return 8 + (c.d.cost || 0); }
    if (c.d.t === 'attachment') { const best = Math.max(-50, ...g.attachTargets(p, c).map(t => AI.attachScore(g, p, c, t))); return best > 0 ? 6 + Math.min(best, 8) * 0.3 : -1; }
    return -1;
  },
  reducerScore(g, p, filter, amt, sac) {
    if (g.phase !== 'marshal' || g.activeP !== p) return 0;
    const already = p.reducers.filter(r => r.modes.includes('marshal'));
    const want = p.hand.filter(c => filter(c) && ['character', 'location', 'attachment'].includes(c.d.t) && !g.findDupeTarget(p, c) && AI.marshalScore(g, p, c) > 0 && !g.uniqueBlockedByDead(p, c));
    for (const c of want) {
      const cur = g.costOf(p, c, 'marshal');
      if (cur <= 0) continue;
      if (cur - amt > p.gold) continue;
      if (sac && cur < 4) continue;
      if (already.length && already.some(r => r.f(c))) { if (cur > 0) return 60; continue; }
      return 60;
    }
    return 0;
  },
  plotScore(g, p, pl) {
    const [inc, ini, claim] = pl.d.p; let s = inc * 1.3 + ini * 0.15 + claim * 2 + Math.random() * 2.5;
    const q = p.opp;
    switch (pl.code) {
      case '01010': s += p.hand.length < 4 ? 4 : -1; break;
      case '01026': s += (q.chars.length - p.chars.length >= 2) ? 8 : -12; break;
      case '01015': s += q.chars.length ? 1 : -3; break;
      case '01020': s += [...p.hand, ...p.discard].some(c => c.d.t === 'character' && (c.d.cost || 0) >= 4 && (c.d.cost || 0) <= 5) ? 5 : -6; break;
      case '01022': case '01006': s += 2; break;
      case '01011': s += 2; break;
      case '01013': s += q.hand.length > 2 ? 2 : -1; break;
      case '01007': s += q.chars.length * 0.9; break;
      case '01012': s -= 4; break;
      case '01003': case '01014': s -= 1; break;
      case '01005': s += p.chars.filter(c => g.hasIcon(c, 'military')).length * 0.5; break;
      case '01016': s -= p.hand.filter(c => c.d.t !== 'character').length * 0.8; break;
    }
    if (g.round === 1) s += inc * 0.6;
    return s;
  },
  challengeScore(g, p, t) {
    const q = p.opp;
    const myA = AI.attPotential(g, p, t);
    const stealthers = p.chars.filter(c => g.canAttackWith(p, c, t) && g.hasKw(c, 'stealth')).length;
    const defs = q.chars.filter(c => !c.kneel && g.hasIcon(c, t)).sort((a, b) => g.str(b) - g.str(a));
    const D = defs.slice(stealthers).reduce((s, c) => s + g.str(c), 0);
    if (myA <= 0) return 0;
    const pri = { military: 3, power: 2, intrigue: 2.5 }[t];
    if (t === 'intrigue' && !q.hand.length && !p.locs.some(l => l.code === '01098')) return D === 0 ? 4 : 0.5;
    if (t === 'military' && !q.chars.length) return D === 0 ? 3 : 0;
    if (D === 0) return 20 + pri;
    if (myA > D) return 10 + pri;
    if (myA === D) return 6 + pri;
    return 0;
  },
  pickAttackers(g, p, type, cands, jousting) {
    const q = p.opp;
    const sorted = [...cands].sort((a, b) => g.str(b) - g.str(a));
    if (jousting) return [sorted[0]];
    const stealth = sorted.filter(c => g.hasKw(c, 'stealth')).length;
    const defs = q.chars.filter(c => !c.kneel && g.hasIcon(c, type)).sort((a, b) => g.str(b) - g.str(a));
    const D = defs.slice(stealth).reduce((s, c) => s + g.str(c), 0);
    if (D === 0) { // um atacante basta; prefere quem não ajoelha / renown
      const best = [...sorted].sort((a, b) => ((ab(b).noKneelAttack && ab(b).noKneelAttack(g, b, type)) ? 5 : 0) + (g.hasKw(b, 'renown') ? 3 : 0) - ((ab(a).noKneelAttack && ab(a).noKneelAttack(g, a, type)) ? 5 : 0) - (g.hasKw(a, 'renown') ? 3 : 0));
      const r = [best[0]];
      for (const c of sorted) if (!r.includes(c) && (g.hasKw(c, 'renown') || (ab(c).noKneelAttack && ab(c).noKneelAttack(g, c, type)))) r.push(c);
      return r;
    }
    const r = []; let s = 0;
    for (const c of sorted) { r.push(c); s += g.str(c); if (s > D) break; }
    // incluir quem não ajoelha (grátis)
    for (const c of sorted) if (!r.includes(c) && ab(c).noKneelAttack && ab(c).noKneelAttack(g, c, type)) r.push(c);
    return r;
  },
  stealthScore(g, p, x, type) { return (!x.kneel && g.hasIcon(x, type)) ? g.str(x) + 5 : 0.1; },
  pickDefenders(g, p, ch, dc, jousting) {
    const A = g.sumStr(ch.attackers);
    const sorted = [...dc].sort((a, b) => g.str(b) - g.str(a));
    if (jousting) return g.str(sorted[0]) > A ? [sorted[0]] : [];
    let r = [], s = 0;
    for (const c of sorted) { r.push(c); s += g.str(c); if (s > A) break; }
    if (s > A) {
      // remover desnecessários (menores primeiro)
      for (const c of [...r].reverse()) if (s - g.str(c) > A) { r = r.filter(x => x !== c); s -= g.str(c); }
      const claimHurts = ch.type === 'military' || ch.type === 'power' || p.hand.length > 1;
      if (claimHurts || Math.random() < 0.6) return r;
      return [];
    }
    // não ganha: evitar unopposed com uma personagem barata
    const cheap = sorted.filter(c => g.str(c) >= 1).sort((a, b) => AI.value(g, a) - AI.value(g, b))[0];
    if (cheap && AI.value(g, cheap) < 7 && Math.random() < 0.5) return [cheap];
    return [];
  },
  ambushScore(g, p, c, ctx) {
    if (!ctx.beforeChallenge) return 0;
    if (c.code === '01095') return (p.hand.length - 1 > p.opp.hand.length && p.opp.chars.length) ? 25 : 0;
    if (c.d.t === 'character') return (CH_TYPES.some(t => g.challengeAllowed(p, t) || !(p.chDone[t])) && g.hasIcon(c, 'military')) ? 7 + g.str(c) : 2;
    if (c.d.t === 'attachment') return 3;
    return 0;
  },
  standScore(g, p, ctx) {
    // levantar personagens: depois de atacar, para defender/dominance
    if (g.phase === 'challenges' && ctx.beforeChallenge && g.activeP === p) return 4;
    if (g.phase === 'dominance') return 6;
    return 0;
  },
  pumpScore(g, p, ch, n) {
    if (!ch) return 0;
    const A = g.sumStr(ch.attackers), D = g.sumStr(ch.defenders);
    if (ch.att === p) { if (A < D && A + n >= D) return 30; return A >= D && A - D < 5 && A - D + n >= 5 ? 8 : 0; }
    if (D <= A && D + n > A) return 30;
    return 0;
  },
  wicScore(g, p) { const ch = g.ch; if (!ch) return 0; const A = g.sumStr(ch.attackers), D = g.sumStr(ch.defenders); return A >= D && A > 0 ? 15 : 0; },
  hmrScore(g, p, ctx) {
    if (g.phase === 'challenges' && ctx.beforeChallenge) { const best = p.hand.filter(c => c.d.t === 'character' && c.d.f === 'lannister').map(c => g.str(c)).sort((a, b) => b - a)[0] || 0; return best >= 4 && CH_TYPES.some(t => g.challengeAllowed(p, t)) ? 9 : 0; }
    return 0;
  },
  tidflScore(g, p) {
    const t = p.opp.chars.filter(c => (c.d.cost || 0) <= p.gold && (c.d.cost || 0) >= 4);
    return t.length ? 12 : 0;
  },
  greyWindScore(g, p, gw, targets, ctx) {
    const enemy = targets.filter(x => x.owner !== p);
    if (!enemy.length) return 0;
    const best = Math.max(...enemy.map(x => AI.value(g, x)));
    if (ctx.ch) return enemy.some(x => participating(g, x) && x.owner === ctx.ch.att) ? 20 : 0;
    if (ctx.beforeChallenge && g.activeP === p) return (p.chDone.military || !g.challengeAllowed(p, 'military')) ? 10 + best : (best >= 6 ? 8 : 0);
    return 0;
  },
  cancelScore(g, q, ev) { return ev.owner !== q ? 5 + (ev.d.cost || 0) : 0; },
  varysScore(g, p) {
    const mine = p.chars.filter(c => c.code !== '01029').reduce((s, c) => s + AI.value(g, c), 0);
    const theirs = p.opp.chars.reduce((s, c) => s + AI.value(g, c), 0);
    return theirs > mine + 10 ? 1 : 0;
  },
};


class AICtrl {
  constructor(delay, legacy) { this.delay = delay || 0; this.isAI = true; this.legacy = !!legacy; }
  async wait() { if (this.delay) await sleep(this.delay); }
  async chooseCards(g, p, o) {
    await this.wait();
    if (o.aiPick) return o.aiPick();
    const sc = o.cands.map(c => ({ c, s: o.ai ? o.ai(c) : 1 })).sort((a, b) => b.s - a.s);
    const r = [];
    for (const x of sc) { if (r.length >= o.max) break; if (r.length < o.min || x.s > 0) r.push(x.c); }
    return r;
  }
  async chooseOption(g, p, o) {
    await this.wait();
    let best = o.options[0], bs = -Infinity;
    for (const op of o.options) { const s = o.ai ? o.ai(op) : 0; if (s > bs) { bs = s; best = op; } }
    return best.value;
  }
  async actionWindow(g, p, o) {
    const items = [];
    for (const a of o.actions || []) items.push({ a, s: typeof a.ai === 'number' ? a.ai : 0 });
    for (const b of o.buttons || []) items.push({ b, s: b.ai || 0 });
    items.sort((x, y) => y.s - x.s);
    const top = items[0];
    if (!top || top.s <= 0) return null;
    await this.wait();
    if (top.a) return top.a;
    return { button: top.b.value };
  }
}

const AIK = { first: 'calc', ratio: 2, defK: 0.8, oppK: 0.7, baseMarshal: false };
const AI_NEW = {
  powW(g, p) { const t = g.totalPower(p); return 3 + (t >= 10 ? 1.5 : 0) + (t >= 13 ? 2 : 0); },
  noKneel(g, c, t) { return !!(ab(c).noKneelAttack && !g.blank(c) && ab(c).noKneelAttack(g, c, t)); },
  remaining(g, p, t) { return Math.max(0, g.maxOfType(p, t) - (p.chDone[t] || 0)); },
  // o adversário ainda vai atacar nesta fase?

  for (const k of ['renown', 'stealth', 'insight', 'intimidate', 'pillage', 'limited', 'terminal']) if (inst && g ? g.hasKw(inst, k) : d.k?.[k]) out.push(KW_PT[k]);
  if (d.k?.ambush != null) out.push(`Ambush(${d.k.ambush})`);
  if (d.m) for (const [k, v] of Object.entries(d.m)) out.push(`${v > 0 ? '+' : ''}${v} ${LX({ income: 'Ouro', initiative: 'Inic.', reserve: 'Res.' }, { income: 'Gold', initiative: 'Init.', reserve: 'Res.' })[k]}`);
  return out;
}
function cardHTML(d, inst, opts = {}) {
  const g = UI.game;
  const fc = `--fc:var(--f-${d.f})`;
  const cls = ['card', 'fac-' + d.f, ...(opts.cls || [])];
  const uid = inst ? `data-uid="${inst.uid}"` : `data-code="${d.c}"`;
  const img = IMG.tag(d.c);
  if (img && IMG.good.has(d.c)) cls.push('hasimg');
  if (d.t === 'plot') {
    return `<div class="${cls.join(' ')} plotc" style="${fc}" ${uid}><div class="hd" style="padding-left:4px">${esc(d.n)}</div><div class="body"><div class="ty">Plot · ${esc(d.tr.join('. '))}</div>${isAuto(d.c) ? '' : '<div class="warn">⚠</div>'}</div><div class="pst"><span title="Gold">💰${d.p[0]}</span><span title="Initiative">⚡${d.p[1]}</span><span title="Claim">⚔${d.p[2]}</span><span title="Reserve">✋${d.p[3]}</span></div>${img}</div>`;
  }
  let s = '', ic = d.i || '', ov = '';
  if (d.t === 'character') {
    let v = d.s, c2 = '';
    if (inst && g && inst.zone === 'chars') {
      v = g.str(inst); c2 = v > d.s ? 'up' : v < d.s ? 'down' : '';
      ic = CH_TYPES.filter(t => g.hasIcon(inst, t)).map(t => ICON_OF[t]).join('');
      if (g.blank(inst)) cls.push('blank');
      if (c2) ov += `<span class="ovstr ${c2}" title="STR">${v}</span>`;
      const gained = [...ic].filter(L => !(d.i || '').includes(L)).join('');
      if (gained) ov += `<span class="ovic">${iconsHTML(gained)}</span>`;
    }
    s = `<div class="str ${c2}">${v}</div><div class="icons">${iconsHTML(ic)}</div>`;
  }
  const kws = kwList(d, inst && inst.zone === 'chars' ? inst : null, g);
  let badges = '';
  if (inst) { if (inst.power) badges += `<span class="tok pow" title="Power">${inst.power}</span>`; if (inst.dupes.length) badges += `<span class="tok dup" title="Duplicates">+${inst.dupes.length}</span>`; }
  const mid = d.t !== 'character' ? `<div class="mid">${esc(d.tr.join('. '))}</div>` : '';
  return `<div class="${cls.join(' ')}" style="${fc}" ${uid}>
    ${d.cost != null ? `<div class="cost">${d.cost}</div>` : ''}<div class="hd">${d.u ? '◆ ' : ''}${esc(d.n)}</div>
    <div class="body"><div class="ty">${TYPE_PT[d.t]}${d.l ? ' · Loyal' : ''}</div>${d.t === 'character' ? `<div class="tr" style="padding-left:18px">${esc(d.tr.join('. '))}</div>` : ''}</div>
    ${mid}${s}<div class="kw" ${d.t !== 'character' ? 'style="left:3px"' : ''}>${esc(kws.join(' · '))}</div>
    ${img}<div class="ov">${ov}</div>
    ${isAuto(d.c) ? '' : `<div class="warn" title="${LX('Habilidade ainda não automatizada', 'Ability not automated yet')}">⚠</div>`}
    <div class="badges">${badges}</div></div>`;
}
function previewHTML(d, inst) {
  const g = UI.game;
  let h = IMG.tag(d.c, 'pvimg' + (d.t === 'plot' ? ' plot' : ''));
  h += `<div class="pv-name">${d.u ? '◆ ' : ''}${esc(d.n)}</div><div class="pv-meta"><span class="fdot" style="--fc:var(--f-${d.f})"></span>${FACTION_NAMES[d.f]} · ${TYPE_PT[d.t]}${d.l ? ' · Loyal' : ''}</div>`;
  if (d.t === 'plot') h += `<div class="pv-row"><span class="stat g">${LX('Ouro', 'Gold')} ${d.p[0]}</span><span class="stat">${LX('Iniciativa', 'Initiative')} ${d.p[1]}</span><span class="stat">Claim ${d.p[2]}</span><span class="stat">Reserve ${d.p[3]}</span></div>`;
  else {
    const row = [];
    if (d.cost != null) row.push(`<span class="stat g">${LX('Custo', 'Cost')} ${d.cost}</span>`);
    if (d.t === 'character') { const v = inst && g && inst.zone === 'chars' ? g.str(inst) : d.s; row.push(`<span class="stat">STR ${v}${v !== d.s ? ` (base ${d.s})` : ''}</span>`); const ic = inst && g && inst.zone === 'chars' ? CH_TYPES.filter(t => g.hasIcon(inst, t)).map(t => ICON_OF[t]).join('') : d.i; row.push(iconsHTML(ic)); }
    if (inst && inst.power) row.push(`<span class="stat p">${LX('Poder', 'Power')} ${inst.power}</span>`);
    h += `<div class="pv-row">${row.join('')}</div>`;
  }
  if (d.tr.length) h += `<div><i>${esc(d.tr.join('. '))}.</i></div>`;
  const kws = kwList(d, inst && inst.zone === 'chars' ? inst : null, g);
  if (kws.length) h += `<div class="pv-row"><b>${esc(kws.join(' · '))}</b></div>`;
  const a = abText(d.c);
  if (a) h += `<div class="pv-txt">${esc(a)}</div>`;
  else if (d.v) h += `<div class="pv-txt">${kws.length ? LX('Só keywords/modificadores — totalmente automatizada.', 'Keywords/modifiers only — fully automated.') : LX('Sem texto de habilidade.', 'No ability text.')}</div>`;
  else h += `<div class="pv-txt pv-warn">${LX('⚠ Habilidade ainda não automatizada: a carta joga apenas com custo, STR, ícones e keywords.', '⚠ Ability not automated yet: the card plays with cost, STR, icons and keywords only.')}</div>`;
  if (inst) {
    if (inst.att && inst.att.length) h += `<div class="pv-row">${LX('Anexos', 'Attachments')}: ${inst.att.map(x => esc(x.d.n)).join(', ')}</div>`;
    if (inst.kneel) h += `<div class="pv-row" style="color:var(--dim)">${LX('Ajoelhada', 'Knelt')}</div>`;
    if (inst.flags && inst.flags.poison) h += `<div class="pv-row" style="color:#9f9">☠ ${LX('Envenenada', 'Poisoned')}</div>`;
  }
  h += `<div class="pv-row"><a href="https://thronesdb.com/card/${d.c}" target="_blank" rel="noopener" class="note">ThronesDB ↗</a></div>`;
  return h;
}
function showPreview(d, inst) { const h = previewHTML(d, inst); document.querySelectorAll('.pvbox').forEach(e => e.innerHTML = h); }

// ---------- controlador humano ----------
class HumanCtrl {
  constructor() { this.isAI = false; }
  chooseCards(g, p, o) {
    if (!o.cands.length) return Promise.resolve([]);
    if (!o.force && o.cands.length <= o.min) return Promise.resolve([...o.cands]);
    return new Promise(res => UI.setPending({ kind: 'select', ...o, sel: [], resolve: res }));
  }
  chooseOption(g, p, o) { return new Promise(res => UI.setPending({ kind: 'option', ...o, resolve: res })); }
  actionWindow(g, p, o) { return new Promise(res => UI.setPending({ kind: 'action', ...o, resolve: res })); }
  inform(g, p, o) {
    if (!UI.pauseInfo) { UI.toast(o.title + ' — ' + o.lines.slice(-3).map(l => l.msg).join(' · '), o.tone); return Promise.resolve(); }
    return new Promise(res => UI.setPending({ kind: 'info', ...o, resolve: res }));
  }
}

    }
    $('#dDup').onclick = () => this.dupDeck();
    $('#dExp').onclick = () => { const t = exportDeckText(dk); this.modal(`<textarea style="width:min(560px,80vw);height:340px">${esc(t)}</textarea><p class="note">${LX('Este texto pode ser importado de volta aqui ou no ThronesDB.', 'This text can be imported back here or into ThronesDB.')}</p>`, [{ label: LX('Copiar', 'Copy'), pri: true, fn: () => { try { navigator.clipboard.writeText(t); } catch (e) { } } }, { label: 'OK' }], LX('Exportar deck', 'Export deck')); };
    $('#dPlay').onclick = () => { const i = this.curIdx; this.tab('play'); if (!this.game && $('#lbMe')) $('#lbMe').value = String(i); };
  },
  // ---------- importação ----------
  thronesdbApiUrls(input) {
    const s = input.trim();
    let m = s.match(/decklist\/view\/(\d+)/); if (m) return [`https://thronesdb.com/api/public/decklist/${m[1]}`];
    m = s.match(/deck\/view\/(\d+)/); if (m) return [`https://thronesdb.com/api/public/deck/${m[1]}`];
    m = s.match(/^(\d+)$/); if (m) return [`https://thronesdb.com/api/public/decklist/${m[1]}`, `https://thronesdb.com/api/public/deck/${m[1]}`];
    return [];
  },
  addImported(txt, m) {
    const { deck, missing } = importDeck(txt);
    this.decks.push(deck); this.saveDecks(); if (m) m.remove();
    this.selectDeck(STARTER_DECKS.length + this.decks.length - 1); this.renderLobby();
    if (missing.length) this.modal(`<p>${LX('Deck importado, mas estas cartas ainda não existem no simulador (só Core Set por agora):', 'Deck imported, but these cards are not in the simulator yet (Core Set only for now):')}</p><div class="note" style="max-height:300px;overflow:auto">${missing.map(esc).join('<br>')}</div>`, [{ label: 'OK' }], LX('Cartas em falta', 'Missing cards'));
  },
  importModal() {
    const m = this.modal(`<div style="max-width:640px">
      <p><b>${LX('1. Por link ou número', '1. By link or number')}</b></p>
      <div style="display:flex;gap:6px"><input id="impUrl" style="flex:1" placeholder="https://thronesdb.com/decklist/view/16711/…  ${LX('ou', 'or')}  16711"><button class="pri" id="impGo">${LX('Buscar', 'Fetch')}</button></div>
      <div id="impUrlMsg" class="note" style="margin-top:4px"></div>
      <p style="margin-top:14px"><b>${LX('2. Copiar e colar', '2. Copy and paste')}</b></p>
      <p class="note">${LX('No ThronesDB abre o deck → <i>Download</i> → <i>Text file</i> (ou <i>Export → Plain text</i>) e cola o conteúdo. Também aceita o JSON de <code>thronesdb.com/api/public/decklist/NÚMERO</code>.', 'On ThronesDB open the deck → <i>Download</i> → <i>Text file</i> (or <i>Export → Plain text</i>) and paste it. The JSON from <code>thronesdb.com/api/public/decklist/NUMBER</code> also works.')}</p>
      <textarea id="impTxt" style="width:100%;height:200px" placeholder="${LX('Cola aqui o texto ou JSON do ThronesDB…', 'Paste ThronesDB text or JSON here…')}"></textarea><div id="impMsg" class="note"></div>
      <p class="note">${LX('Por agora só existem as cartas do Core Set; as outras são listadas como em falta.', 'Only Core Set cards exist for now; others are listed as missing.')}</p></div>`,
      [{ label: LX('Importar texto', 'Import text'), pri: true, fn: false }, { label: LX('Cancelar', 'Cancel') }], LX('Importar do ThronesDB', 'Import from ThronesDB'));
    m.querySelector('[data-mb="0"]').onclick = () => {
      const txt = m.querySelector('#impTxt').value; if (!txt.trim()) return;
      try { this.addImported(txt, m); } catch (e) { m.querySelector('#impMsg').innerHTML = `<span style="color:#ff9c90">${LX('Não consegui ler', 'Could not read it')}: ${esc(e.message)}</span>`; }
    };
    m.querySelector('#impGo').onclick = async () => {
      const urls = this.thronesdbApiUrls(m.querySelector('#impUrl').value); const msg = m.querySelector('#impUrlMsg');
      if (!urls.length) { msg.innerHTML = `<span style="color:#ff9c90">${LX('Link não reconhecido. Usa um link de decklist/deck do ThronesDB ou o número.', 'Link not recognised. Use a ThronesDB decklist/deck link or its number.')}</span>`; return; }
      msg.textContent = LX('A buscar…', 'Fetching…');
      for (const u of urls) {
        try { const r = await fetch(u); if (!r.ok) continue; const j = await r.json(); if (!j || !j.slots) continue; this.addImported(JSON.stringify(j), m); return; } catch (e) { }
      }
      msg.innerHTML = `<span style="color:#ff9c90">${LX('Não consegui contactar o ThronesDB a partir desta página (o browser pode estar a bloquear). Abre o link da API no browser e cola o JSON na opção 2: ', 'Could not reach ThronesDB from this page (the browser may be blocking it). Open the API link in your browser and paste the JSON in option 2: ')}<a href="${urls[0]}" target="_blank" rel="noopener">${urls[0]}</a></span>`;
    };
  },
  // ---------- ajuda ----------
  renderHelp() {
    const auto = CARDS.filter(d => isAuto(d.c) && d.t !== 'agenda'), notAuto = CARDS.filter(d => !isAuto(d.c) && d.t !== 'agenda');
    $('#help').innerHTML = `<div class="wrap"><div class="help">
      <div class="panel"><h2>${LX('O que está automatizado', 'What is automated')}</h2><div class="note" style="color:var(--txt)">${LX(
      '<b>Regras base:</b> setup (8 ouro, 1 limited), as 7 fases, iniciativa (desempate por menos poder), primeiro jogador, income/initiative/reserve com modificadores, marshaling com redutores, duplicados (grátis, salvam a carta), unique e dead pile, limited (1 por ronda), desafios Militar/Intriga/Poder, stealth, unopposed, claim (mortes, descarte aleatório, roubo de poder), keywords (renown, insight, intimidate, pillage), ambush, dominance, standing, taxation e descarte por reserve. Ganha quem chegar a 15 de poder; perde quem ficar sem baralho.<br><br><b>Simplificações:</b> há janelas de ações antes de cada desafio, depois dos defensores e na dominance (não entre todos os passos); Treachery e as habilidades das outras facções ainda não estão programadas.<br><br><b>Imagens:</b> as imagens vêm do ThronesDB (ou do CDN da FFG). A página publicada no Claude bloqueia imagens externas, por isso lá aparecem as cartas desenhadas; no ficheiro HTML descarregado as imagens aparecem.',
      '<b>Core rules:</b> setup (8 gold, 1 limited), all 7 phases, initiative (ties go to lower power), first player, income/initiative/reserve with modifiers, marshaling with cost reducers, duplicates (free, save the card), unique and dead pile, limited (1 per round), Military/Intrigue/Power challenges, stealth, unopposed, claim (kills, random discard, power steal), keywords (renown, insight, intimidate, pillage), ambush, dominance, standing, taxation and reserve discard. First to 15 power wins; running out of deck loses.<br><br><b>Simplifications:</b> action windows happen before each challenge, after defenders are declared and in dominance (not between every step); Treachery and other factions\' abilities are not programmed yet.<br><br><b>Images:</b> images come from ThronesDB (or the FFG CDN). The page published in Claude blocks external images, so drawn cards show there; in the downloaded HTML file the images appear.')}</div></div>
      <div class="panel" style="position:sticky;top:0;z-index:2"><div class="pvbox" style="min-height:60px"><span class="note">${LX('Passa o rato por cima de uma carta para ver os detalhes.', 'Hover over a card to see its details.')}</span></div></div>
      <div class="panel"><h2>${LX('Cartas automatizadas', 'Automated cards')} (${auto.length})</h2><div class="autolist">${auto.map(d => `<div data-code="${d.c}"><span class="fdot" style="--fc:var(--f-${d.f})"></span>${esc(d.n)}</div>`).join('')}</div></div>
      <div class="panel"><h2>${LX('Ainda por automatizar', 'Not automated yet')} (${notAuto.length})</h2><p class="note">${LX('Estas cartas já entram no deck e jogam com custo, STR, ícones e keywords — só falta o texto especial.', 'These cards can already be used and play with cost, STR, icons and keywords — only the special text is missing.')}</p><div class="autolist">${notAuto.map(d => `<div data-code="${d.c}"><span class="fdot" style="--fc:var(--f-${d.f})"></span>${esc(d.n)}</div>`).join('')}</div></div>
    </div></div>`;
  },
};
window.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
